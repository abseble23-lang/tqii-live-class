lass=\"t\">অনুশীলনী — ৪<\/div><div class=\"e\">Review — Part 4<\/div><\/div><div class=\"badge\"><b>দিন ৪১<\/b><i>Day 41<\/i><\/div><\/div><div style=\"flex:1 1 0;display:flex;flex-direction:column\"><table class=\"ex\" style=\"height:100%\"><tr><td class=\"n\">প্রশ্ন ১<\/td><td>তাশদীদ কাকে বলে? তাশদীদের হরফ কতবার পড়া হয়?<span class=\"en\">What is a shaddah?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ২<\/td><td>এগুলো পড়ো।<span class=\"en\">Read these.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">أَبَّ إِنَّ ثُمَّ رَبِّ<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৩<\/td><td>গুন্নাহ কাকে বলে? কোথা থেকে উচ্চারিত হয়?<span class=\"en\">What is ghunnah? Where from?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৪<\/td><td>মদের হরফ কয়টি ও কী কী?<span class=\"en\">Name the madd letters.<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৫<\/td><td>এগুলো পড়ো।<span class=\"en\">Read these.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">بَا بِي بُو قَالَ نُورٌ<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৬<\/td><td>খাড়া যবর, খাড়া যের ও উল্টা পেশ কত আলিফ টানতে হয়?<span class=\"en\">How long are the standing vowels?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৭<\/td><td>মদ্দে মুত্তাসিল ও মুনফাসিলের পার্থক্য কী?<span class=\"en\">Muttaṣil vs munfaṣil?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৮<\/td><td>মদ্দে মুত্তাসিল কত আলিফ? মদ্দে লীন কত আলিফ?<span class=\"en\">How many alifs for muttaṣil and līn?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৯<\/td><td>কোন মদ? সঠিকভাবে পড়ো।<span class=\"en\">Which madd? Read correctly.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">جَآءَ · ٱلضَّآلِّينَ<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ১০<\/td><td>মদ্দে আরিদ কখন হয়?<span class=\"en\">When does madd ʿāriḍ occur?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><\/table><\/div>"}, {"id": "l45", "bn": "নূন সাকিন ও তানবীন — ৪ নিয়ম", "en": "Nūn sākinah & tanwīn", "no": 42, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪২<\/b><i>Lesson 42<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">নূন সাকিন ও তানবীন<\/div><div class=\"e\">Nūn Sākinah & Tanwīn — 4 Rules<\/div><\/div><div class=\"badge\"><b>দিন ৪২<\/b><i>Day 42<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : নূন সাকিন ও তানবীন কয় প্রকারে পড়া যায়?<\/p><p class=\"a\">উত্তর : নূন সাকিন ( <span class=\"arx\">نْ<\/span> ) বা তানবীনের পরে কোন হরফ আসছে তার উপর ভিত্তি করে ৪ প্রকারে পড়া হয়: ইযহার, ইদগাম, ইকলাব ও ইখফা।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: How many rules for nūn sākinah & tanwīn?<\/p><p class=\"a\">A: Four, depending on the letter that follows: iẓhār, idghām, iqlāb and ikhfāʾ.<\/p><\/div><\/div><div style=\"text-align:center;margin:1mm 0 2mm\"><span style=\"display:inline-block;background:#0E6B5C;color:#fff;border-radius:3mm;padding:1.6mm 6mm;font-weight:700;font-size:12pt\"><span class=\"arx\">نْ · ـً ـٍ ـٌ<\/span> <span style=\"font-weight:500;font-size:9pt\">+ পরের হরফ / next letter<\/span><\/span>\n            <svg viewBox=\"0 0 400 22\" style=\"display:block;width:150mm;margin:0 auto;height:8mm\"><path d=\"M200 0 V8 M50 8 H350 M50 8 V22 M150 8 V22 M250 8 V22 M350 8 V22\" stroke=\"#0E6B5C\" stroke-width=\"1.6\" fill=\"none\"/><\/svg><\/div><div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:2.5mm;flex:1\"><div class=\"card\" style=\"border-color:#1F7A4D;border-top:2mm solid #1F7A4D\"><h4 style=\"color:#1F7A4D\">ইযহার<small>Iẓhār — clear<\/small><\/h4>\n        <div class=\"ar\" style=\"font-size:21pt;color:#1F7A4D;text-align:center;line-height:1.6\">ء ه ع ح غ خ<\/div>\n        <p style=\"margin:0;font-size:9.4pt;line-height:1.45\">৬টি হলকী হরফ এলে নূন স্পষ্ট পড়তে হয়, গুন্নাহ ছাড়া।<\/p><p class=\"en\" style=\"margin:0;font-size:7.6pt\">Before the 6 throat letters: pronounce the n clearly.<\/p><\/div><div class=\"card\" style=\"border-color:#8C2A3C;border-top:2mm solid #8C2A3C\"><h4 style=\"color:#8C2A3C\">ইদগাম<small>Idghām — merging<\/small><\/h4>\n        <div class=\"ar\" style=\"font-size:21pt;color:#8C2A3C;text-align:center;line-height:1.6\">ي ر م ل و ن<\/div>\n        <p style=\"margin:0;font-size:9.4pt;line-height:1.45\"><span class=\"arx\">يَرْمَلُونَ<\/span>-এর ৬ হরফে নূন মিশে যায়: <span class=\"arx\">ي ن م و<\/span>-তে গুন্নাহসহ, <span class=\"arx\">ل ر<\/span>-তে গুন্নাহ ছাড়া।<\/p><p class=\"en\" style=\"margin:0;font-size:7.6pt\">Before the 6 letters of yarmalūn the n merges — with ghunnah (<span class=\"arx\">ي ن م و<\/span>), without (<span class=\"arx\">ل ر<\/span>).<\/p><\/div><div class=\"card\" style=\"border-color:#5B3A8C;border-top:2mm solid #5B3A8C\"><h4 style=\"color:#5B3A8C\">ইকলাব<small>Iqlāb — changing<\/small><\/h4>\n        <div class=\"ar\" style=\"font-size:21pt;color:#5B3A8C;text-align:center;line-height:1.6\">ب<\/div>\n        <p style=\"margin:0;font-size:9.4pt;line-height:1.45\"><span class=\"arx\">ب<\/span> এলে নূন মীমে বদলে যায়, গুন্নাহসহ।<\/p><p class=\"en\" style=\"margin:0;font-size:7.6pt\">Before <span class=\"arx\">ب<\/span> the n turns into a m sound, with ghunnah.<\/p><\/div><div class=\"card\" style=\"border-color:#B3541E;border-top:2mm solid #B3541E\"><h4 style=\"color:#B3541E\">ইখফা<small>Ikhfāʾ — hiding<\/small><\/h4>\n        <div class=\"ar\" style=\"font-size:21pt;color:#B3541E;text-align:center;line-height:1.6\">ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك<\/div>\n        <p style=\"margin:0;font-size:9.4pt;line-height:1.45\">বাকি ১৫টি হরফে নূন লুকিয়ে গুন্নাহসহ পড়তে হয়।<\/p><p class=\"en\" style=\"margin:0;font-size:7.6pt\">Before the other 15 letters the n is hidden, with ghunnah.<\/p><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>একই শব্দের ভেতরে নূন সাকিনের পরে <span class=\"arx\">ي<\/span> বা <span class=\"arx\">و<\/span> এলে ইদগাম হয় না, ইযহার হয় — যেমন <span class=\"arx\">ٱلدُّنۡيَا · صِنۡوَانٞ<\/span>।<span class=\"en\">Inside one word, n before <span class=\"arx\">ي<\/span>/<span class=\"arx\">و<\/span> is read clearly (iẓhār): ad-dunyā, ṣinwān.<\/span><\/div><\/div>"}, {"id": "l46", "bn": "ইযহার", "en": "Iẓhār — Clear Pronunciation", "no": 43, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪৩<\/b><i>Lesson 43<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">ইযহার<\/div><div class=\"e\">Iẓhār — Clear Pronunciation<\/div><\/div><div class=\"badge\"><b>দিন ৪৩<\/b><i>Day 43<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : ইযহার কাকে বলে?<\/p><p class=\"a\">উত্তর : নূন সাকিন বা তানবীনের পরে হলকের ৬টি হরফের কোনো একটি এলে নূনকে গুন্নাহ ছাড়া স্পষ্ট করে পড়াকে ইযহার বলে।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is iẓhār?<\/p><p class=\"a\">A: When a throat letter follows nūn sākinah or tanwīn, the n is pronounced clearly, without extra ghunnah.<\/p><\/div><\/div><div class=\"card\" style=\"text-align:center;margin-bottom:2.5mm\"><span class=\"ar\" style=\"font-size:30pt;color:#C0392B;letter-spacing:8px\">ء ه ع ح غ خ<\/span><\/div><div class=\"sl\"><b>কুরআন থেকে উদাহরণ<\/b><i>Examples from the Quran · নিয়মের অংশ লাল রঙে<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(3,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مَ<span class=\"hl\">نۡ ءَ<\/span>امَنَ<\/div><div class=\"r\">২:৬২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">نۡ عِ<\/span>لۡمٍ<\/div><div class=\"r\">৪:১৫৭<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِّ<span class=\"hl\">نۡ خَ<\/span>وۡفِۭ<\/div><div class=\"r\">১০৬:৪<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">نۡ هَ<\/span>ادࣲ<\/div><div class=\"r\">১৩:৩৩<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">وَيَ<span class=\"hl\">نۡـَٔ<\/span>وۡنَ<\/div><div class=\"r\">৬:২৬<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِّ<span class=\"hl\">نۡ غِ<\/span>لࣲّ<\/div><div class=\"r\">৭:৪৩<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">أَ<span class=\"hl\">نۡعَ<\/span>مۡتَ<\/div><div class=\"r\">১:৭<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">عَ<span class=\"hl\">نۡهُ<\/span><\/div><div class=\"r\">৮০:১০<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِّ<span class=\"hl\">نۡ حَ<\/span>كِيمٍ<\/div><div class=\"r\">৪১:৪২<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>ইযহারের সময় নূনের পর থামবেন না, আবার মিশিয়েও দেবেন না।<span class=\"en\">Do not pause after the n, and do not merge it.<\/span><\/div><\/div>"}, {"id": "l47", "bn": "ইদগাম", "en": "Idghām — Merging", "no": 44, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪৪<\/b><i>Lesson 44<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">ইদগাম<\/div><div class=\"e\">Idghām — Merging<\/div><\/div><div class=\"badge\"><b>দিন ৪৪<\/b><i>Day 44<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : ইদগাম কাকে বলে? কয় প্রকার?<\/p><p class=\"a\">উত্তর : নূন সাকিন বা তানবীনের পরে <span class=\"arx\">يَرْمَلُونَ<\/span> শব্দের ৬টি হরফের কোনো একটি এলে নূনকে পরের হরফের সাথে মিশিয়ে পড়াকে ইদগাম বলে। ইয়া, নূন, মীম ও ওয়াও-তে গুন্নাহসহ; লাম ও রা-তে গুন্নাহ ছাড়া।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is idghām?<\/p><p class=\"a\">A: Merging the n into a following letter of yarmalūn — with ghunnah for yāʾ, nūn, mīm, wāw; without ghunnah for lām and rāʾ.<\/p><\/div><\/div><div class=\"two\" style=\"margin-bottom:2mm\"><div class=\"card\" style=\"text-align:center\"><b>গুন্নাহসহ · with ghunnah<\/b><div class=\"ar\" style=\"font-size:26pt;color:#C0392B;letter-spacing:6px\">ي ن م و<\/div><\/div><div class=\"card\" style=\"text-align:center\"><b>গুন্নাহ ছাড়া · without ghunnah<\/b><div class=\"ar\" style=\"font-size:26pt;color:#1F7A4D;letter-spacing:6px\">ل ر<\/div><\/div><\/div><div class=\"sl\"><b>কুরআন থেকে উদাহরণ<\/b><i>Examples from the Quran · নিয়মের অংশ লাল রঙে<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(3,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مَ<span class=\"hl\">ن يَ<\/span>قُولُ<\/div><div class=\"r\">২:৮<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِّ<span class=\"hl\">ن نِّ<\/span>عۡمَةࣲ<\/div><div class=\"r\">১৬:৫৩<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِّ<span class=\"hl\">ن مَّ<\/span>آءࣲ<\/div><div class=\"r\">২৪:৪৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">ن وَ<\/span>الٍ<\/div><div class=\"r\">১৩:১১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">خَيۡرࣰ<span class=\"hl\">ا يَ<\/span>رَهُۥ<\/div><div class=\"r\">৯৯:৭<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِّ<span class=\"hl\">ن رَّ<\/span>بِّهِمۡ<\/div><div class=\"r\">২:৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">ن لَّ<\/span>دُنۡهُ<\/div><div class=\"r\">৪:৪০<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">هُدࣰ<span class=\"hl\">ى لِّ<\/span>لۡمُتَّقِينَ<\/div><div class=\"r\">২:২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">غَفُو<span class=\"hl\">رࣱ رَّ<\/span>حِيمٌ<\/div><div class=\"r\">২:১৭৩<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>মাদানী ছাপায় ইদগামের জায়গায় নূনের উপর সাকিন থাকে না এবং পরের হরফে তাশদীদ থাকতে পারে।<span class=\"en\">In the Madani Muṣḥaf the nūn has no sukūn where idghām applies, and the next letter often carries a shaddah.<\/span><\/div><\/div>"}, {"id": "l48", "bn": "ইকলাব", "en": "Iqlāb — Changing n to m", "no": 45, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪৫<\/b><i>Lesson 45<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">ইকলাব<\/div><div class=\"e\">Iqlāb — Changing n to m<\/div><\/div><div class=\"badge\"><b>দিন ৪৫<\/b><i>Day 45<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : ইকলাব কাকে বলে?<\/p><p class=\"a\">উত্তর : নূন সাকিন বা তানবীনের পরে <span class=\"arx\">ب<\/span> এলে নূনকে মীমে বদলে গুন্নাহসহ পড়াকে ইকলাব বলে।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is iqlāb?<\/p><p class=\"a\">A: When <span class=\"arx\">ب<\/span> follows nūn sākinah or tanwīn, the n changes to a hidden m sound with ghunnah.<\/p><\/div><\/div><div class=\"card\" style=\"text-align:center;margin-bottom:2.5mm\"><span class=\"ar\" style=\"font-size:30pt;color:#C0392B;letter-spacing:8px\">ب<\/span><\/div><div class=\"sl\"><b>কুরআন থেকে উদাহরণ<\/b><i>Examples from the Quran · নিয়মের অংশ লাল রঙে<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(3,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">نۢ بَ<\/span>عۡدِ<\/div><div class=\"r\">২:২৭<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">أَ<span class=\"hl\">نۢبِ<\/span>ئۡهُم<\/div><div class=\"r\">২:৩৩<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">سَمِيعُ<span class=\"hl\">ۢ بَ<\/span>صِيرٌ<\/div><div class=\"r\">৩১:২৮<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">لَيُ<span class=\"hl\">نۢبَ<\/span>ذَنَّ<\/div><div class=\"r\">১০৪:৪<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">ٱ<span class=\"hl\">نۢبَ<\/span>عَثَ<\/div><div class=\"r\">৯১:১২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">نۢ بَ<\/span>يۡنِ<\/div><div class=\"r\">৪১:৪২<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>কুরআনে ইকলাবের জায়গায় নূনের উপর ছোট মীম ( <span class=\"arx\">ۢ<\/span> ) লেখা থাকে। ঠোঁট হালকা মিলিয়ে গুন্নাহ করুন।<span class=\"en\">A small mīm ( <span class=\"arx\">ۢ<\/span> ) marks iqlāb. Close the lips lightly and hold the ghunnah.<\/span><\/div><\/div>"}, {"id": "l49", "bn": "ইখফা", "en": "Ikhfāʾ — Hiding", "no": 46, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪৬<\/b><i>Lesson 46<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">ইখফা<\/div><div class=\"e\">Ikhfāʾ — Hiding<\/div><\/div><div class=\"badge\"><b>দিন ৪৬<\/b><i>Day 46<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : ইখফা কাকে বলে?<\/p><p class=\"a\">উত্তর : নূন সাকিন বা তানবীনের পরে ইখফার ১৫টি হরফের কোনো একটি এলে নূনকে নাকের বাঁশিতে লুকিয়ে গুন্নাহসহ পড়াকে ইখফা বলে।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is ikhfāʾ?<\/p><p class=\"a\">A: Before any of the 15 ikhfāʾ letters, the n is hidden in the nose with ghunnah — between clear and merged.<\/p><\/div><\/div><div class=\"card\" style=\"text-align:center;margin-bottom:2.5mm\"><span class=\"ar\" style=\"font-size:30pt;color:#C0392B;letter-spacing:8px\">ت ث ج د ذ ز س ش ص ض ط ظ ف ق ك<\/span><\/div><div class=\"sl\"><b>কুরআন থেকে উদাহরণ<\/b><i>Examples from the Quran · নিয়মের অংশ লাল রঙে<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(3,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">أَ<span class=\"hl\">نتُ<\/span>مۡ<\/div><div class=\"r\">২:২২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">ن قَ<\/span>بۡلِكَ<\/div><div class=\"r\">২:৪<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">يُ<span class=\"hl\">نفِ<\/span>قُونَ<\/div><div class=\"r\">২:৩<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مُ<span class=\"hl\">نذِ<\/span>رࣱ<\/div><div class=\"r\">১৩:৭<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">ن شَ<\/span>رِّ<\/div><div class=\"r\">১১৩:২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">عَ<span class=\"hl\">ن صَ<\/span>لَاتِهِمۡ<\/div><div class=\"r\">১০৭:৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">أَ<span class=\"hl\">نزَ<\/span>لۡنَٰهُ<\/div><div class=\"r\">৯৭:১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">كُ<span class=\"hl\">نتُ<\/span>مۡ<\/div><div class=\"r\">২:২৩<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">مِ<span class=\"hl\">ن ثَ<\/span>مَرَةࣲ<\/div><div class=\"r\">২:২৫<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>ইখফার সময় জিহ্বা নূনের জায়গায় লাগবে না; পরের হরফের মাখরাজের দিকে প্রস্তুত থাকবে।<span class=\"en\">The tongue does not touch the place of nūn; it gets ready for the next letter.<\/span><\/div><\/div>"}, {"id": "l50", "bn": "মীম সাকিনের নিয়ম", "en": "Mīm sākinah", "no": 47, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪৭<\/b><i>Lesson 47<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">মীম সাকিনের নিয়ম<\/div><div class=\"e\">Mīm Sākinah — 3 Rules<\/div><\/div><div class=\"badge\"><b>দিন ৪৭<\/b><i>Day 47<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : মীম সাকিন কাকে বলে? এটি কয় প্রকারে পড়া হয়?<\/p><p class=\"a\">উত্তর : সাকিনওয়ালা মীম ( <span class=\"arx\">مْ<\/span> )-কে মীম সাকিন বলে। পরের হরফ অনুযায়ী এটি ৩ প্রকারে পড়া হয়।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is mīm sākinah?<\/p><p class=\"a\">A: A mīm with sukūn. It is read in 3 ways depending on the next letter.<\/p><\/div><\/div><div class=\"sl\"><b>ইখফায়ে শাফাভী<\/b><i>Ikhfāʾ shafawī<\/i><\/div><div style=\"display:grid;grid-template-columns:44mm 1fr;gap:2.5mm;margin-bottom:1mm\"><div class=\"card\" style=\"text-align:center\"><div class=\"ar\" style=\"font-size:26pt;color:#C0392B;font-weight:700\">ب<\/div><div style=\"font-size:9pt\">গুন্নাহসহ লুকিয়ে<\/div><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C\">hidden, with ghunnah<\/div><\/div><div class=\"exm\" style=\"grid-template-columns:repeat(2,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:22pt\">تَرۡمِي<span class=\"hl\">هِم بِ<\/span>حِجَارَةࣲ<\/div><div class=\"r\">১০৫:৪<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:22pt\">وَمَا هُ<span class=\"hl\">م بِ<\/span>مُؤۡمِنِينَ<\/div><div class=\"r\">২:৮<\/div><\/div><\/div><\/div><div class=\"sl\"><b>ইদগামে শাফাভী (মিসলাইন)<\/b><i>Idghām shafawī<\/i><\/div><div style=\"display:grid;grid-template-columns:44mm 1fr;gap:2.5mm;margin-bottom:1mm\"><div class=\"card\" style=\"text-align:center\"><div class=\"ar\" style=\"font-size:26pt;color:#C0392B;font-weight:700\">م<\/div><div style=\"font-size:9pt\">মিশিয়ে, গুন্নাহসহ<\/div><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C\">merged, with ghunnah<\/div><\/div><div class=\"exm\" style=\"grid-template-columns:repeat(2,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:22pt\">كَ<span class=\"hl\">م مِّ<\/span>ن<\/div><div class=\"r\">২:২৪৯<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:22pt\">وَءَامَنَ<span class=\"hl\">هُم مِّ<\/span>نۡ<\/div><div class=\"r\">১০৬:৪<\/div><\/div><\/div><\/div><div class=\"sl\"><b>ইযহারে শাফাভী<\/b><i>Iẓhār shafawī<\/i><\/div><div style=\"display:grid;grid-template-columns:44mm 1fr;gap:2.5mm;margin-bottom:1mm\"><div class=\"card\" style=\"text-align:center\"><div class=\"\" style=\"font-size:11pt;color:#C0392B;font-weight:700\">বাকি সব হরফ<\/div><div style=\"font-size:9pt\">স্পষ্ট, গুন্নাহ ছাড়া<\/div><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C\">clear, no ghunnah<\/div><\/div><div class=\"exm\" style=\"grid-template-columns:repeat(3,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:22pt\">أَلَ<span class=\"hl\">مۡ تَ<\/span>رَ<\/div><div class=\"r\">১০৫:১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:22pt\">لَكُ<span class=\"hl\">مۡ دِ<\/span>ينُكُمۡ<\/div><div class=\"r\">১০৯:৬<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:22pt\">عَلَيۡهِ<span class=\"hl\">مۡ وَ<\/span>لَا<\/div><div class=\"r\">১:৭<\/div><\/div><\/div><\/div><div style=\"flex:1\"><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>মীম সাকিনের পরে <span class=\"arx\">و<\/span> বা <span class=\"arx\">ف<\/span> এলে বিশেষ খেয়াল রেখে স্পষ্ট পড়ুন — এখানে ইখফা করা যাবে না।<span class=\"en\">Be extra clear before <span class=\"arx\">و<\/span> and <span class=\"arx\">ف<\/span> — never hide the mīm there.<\/span><\/div><\/div>"}, {"id": "l51", "bn": "আল্লাহ শব্দের লাম", "en": "The lām of Allah", "no": 48, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪৮<\/b><i>Lesson 48<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">আল্লাহ শব্দের লাম<\/div><div class=\"e\">The Lām of “Allah”<\/div><\/div><div class=\"badge\"><b>দিন ৪৮<\/b><i>Day 48<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : আল্লাহ শব্দের লাম কখন পুর ও কখন বারীক পড়তে হয়?<\/p><p class=\"a\">উত্তর : আল্লাহ শব্দের আগের হরফে যবর বা পেশ থাকলে লাম পুর (মোটা) করে, আর যের থাকলে বারীক (চিকন) করে পড়তে হয়।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: When is the lām of Allah heavy or light?<\/p><p class=\"a\">A: After a fatḥah or ḍammah it is heavy (tafkhīm); after a kasrah it is light (tarqīq).<\/p><\/div><\/div><div class=\"sl\"><b>পুর (মোটা) — আগে যবর/পেশ<\/b><i>Heavy — after fatḥah / ḍammah<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(4,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">قَالَ <span class=\"hl\">ٱللَّهُ<\/span><\/div><div class=\"r\">৩:৫৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">رَّسُولُ <span class=\"hl\">ٱللَّهِ<\/span><\/div><div class=\"r\">৪৮:২৯<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">هُوَ <span class=\"hl\">ٱللَّهُ<\/span><\/div><div class=\"r\">১১২:১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">نَصۡرُ <span class=\"hl\">ٱللَّهِ<\/span><\/div><div class=\"r\">১১০:১<\/div><\/div><\/div><div class=\"sl\"><b>বারীক (চিকন) — আগে যের<\/b><i>Light — after kasrah<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(4,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">بِسۡمِ <span class=\"hl\">ٱللَّهِ<\/span><\/div><div class=\"r\">১:১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">لِلَّهِ<\/span><\/div><div class=\"r\">১:২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">دِينِ <span class=\"hl\">ٱللَّهِ<\/span><\/div><div class=\"r\">১১০:২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">بِ<span class=\"hl\">ٱللَّهِ<\/span><\/div><div class=\"r\">২:৮<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>শুরুতে “আল্লাহ” শব্দ দিয়ে পড়া আরম্ভ করলে লাম পুর পড়তে হয়।<span class=\"en\">When you start reading from the word “Allāh”, the lām is heavy.<\/span><\/div><\/div>"}, {"id": "l52", "bn": "র পুর ও বারীক পড়ার নিয়ম", "en": "Heavy & light rāʾ", "no": 49, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৪৯<\/b><i>Lesson 49<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">র (<span class=\"arx\">رَا<\/span>) পুর ও বারীক পড়ার নিয়ম<\/div><div class=\"e\">Heavy & Light Rāʾ<\/div><\/div><div class=\"badge\"><b>দিন ৪৯<\/b><i>Day 49<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : রা কখন পুর আর কখন বারীক পড়তে হয়?<\/p><p class=\"a\">উত্তর : হরকত ও আগের হরফের অবস্থা অনুযায়ী রা কখনো পুর (মোটা), কখনো বারীক (চিকন) পড়া হয়। মৌলিক নিয়মগুলো নিচে দেওয়া হলো।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: When is rāʾ heavy or light?<\/p><p class=\"a\">A: It depends on its own vowel and on the letter before it. The basic rules are below.<\/p><\/div><\/div><div class=\"two\" style=\"gap:3mm\"><div><div class=\"card\" style=\"background:#8C2A3C;color:#fff;text-align:center;margin-bottom:2mm\"><b style=\"font-size:13pt\">পুর (মোটা)<\/b><div style=\"font-family:Montserrat;font-size:7.6pt\">Heavy — tafkhīm<\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">১. রা-তে যবর বা পেশ থাকলে<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">Rāʾ with fatḥah or ḍammah<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\"><span class=\"hl\">رَ<\/span>بِّ<\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">১:২<\/div><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">২. রা সাকিন এবং আগের হরফে যবর বা পেশ<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">Sākin rāʾ after fatḥah / ḍammah<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\">وَٱنۡحَ<span class=\"hl\">رۡ<\/span><\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">১০৮:২<\/div><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">৩. রা সাকিন, আগে অস্থায়ী (আরিদি) যের<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">Sākin rāʾ after a temporary kasrah<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\"><span class=\"hl\">ٱرۡ<\/span>جِعِيٓ<\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">৮৯:২৮<\/div><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">৪. রা সাকিন, আগে যের আর পরে পুর হরফ<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">Sākin rāʾ after kasrah, then a heavy letter<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\">لَبِٱلۡمِ<span class=\"hl\">رۡصَ<\/span>ادِ<\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">৮৯:১৪<\/div><\/div><\/div><\/div><div><div class=\"card\" style=\"background:#1F4E8C;color:#fff;text-align:center;margin-bottom:2mm\"><b style=\"font-size:13pt\">বারীক (চিকন)<\/b><div style=\"font-family:Montserrat;font-size:7.6pt\">Light — tarqīq<\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">১. রা-তে যের থাকলে<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">Rāʾ with kasrah<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\"><span class=\"hl\">رِ<\/span>جَالࣱ<\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">২৪:৩৭<\/div><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">২. রা সাকিন, আগে আসলি যের, পরে পুর হরফ নেই<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">Sākin rāʾ after original kasrah, no heavy letter after<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\">فِ<span class=\"hl\">رۡ<\/span>عَوۡنُ<\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">৭৩:১৬<\/div><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">৩. ওয়াকফে রা-এর আগে সাকিন ইয়া<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">On stopping, after a sākin yāʾ<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\">خَيۡ<span class=\"hl\">رࣱ<\/span><\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">৯৭:৩<\/div><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm;display:grid;grid-template-columns:1fr 34mm;align-items:center;gap:2mm\"><div style=\"font-size:9.4pt;line-height:1.35\">৪. ওয়াকফে রা-এর আগে সাকিন হরফ, তার আগে যের<span style=\"display:block;font-family:Montserrat;font-size:7.2pt;color:#666\">On stopping, after a sākin letter preceded by kasrah<\/span><\/div><div style=\"text-align:center\"><div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.5\">ٱلذِّكۡ<span class=\"hl\">رَ<\/span><\/div><div style=\"font-family:Montserrat;font-size:6.6pt;color:#999\">১৫:৯<\/div><\/div><\/div><\/div><\/div><div style=\"flex:1\"><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>পুর হরফ (ইস্তি‘লা): <span class=\"arx\">خ ص ض غ ط ق ظ<\/span> । কিছু শব্দে (যেমন <span class=\"arx\">فِرۡقٖ<\/span>) দুই রকম পড়াই বৈধ — শিক্ষকের কাছ থেকে শুনে নিন।<span class=\"en\">Heavy letters: <span class=\"arx\">خ ص ض غ ط ق ظ<\/span>. A few words (e.g. firq) allow both — learn them from your teacher.<\/span><\/div><\/div>"}, {"id": "l53", "bn": "ওয়াকফ ও থামার চিহ্ন", "en": "Stopping & pause signs", "no": 50, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫০<\/b><i>Lesson 50<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">ওয়াকফ ও থামার চিহ্ন<\/div><div class=\"e\">Stopping (Waqf) & Pause Signs<\/div><\/div><div class=\"badge\"><b>দিন ৫০<\/b><i>Day 50<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : ওয়াকফ কাকে বলে?<\/p><p class=\"a\">উত্তর : তিলাওয়াতের সময় শ্বাস নিয়ে আবার পড়ার উদ্দেশ্যে কোনো শব্দের শেষে থামাকে ওয়াকফ বলে।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is waqf?<\/p><p class=\"a\">A: Pausing at the end of a word to take a breath, intending to continue reading.<\/p><\/div><\/div><div class=\"sl\"><b>মাদানী ছাপার থামার চিহ্ন<\/b><i>Pause signs in the Madani Muṣḥaf<\/i><\/div><table class=\"t\"><tr><th style=\"width:30mm\">চিহ্ন<\/th><th>নাম<small>Name<\/small><\/th><th>নিয়ম<small>Rule<\/small><\/th><\/tr><tr><td class=\"arcell\" style=\"font-size:22pt;color:#C0392B\">۝<\/td><td>আয়াতের শেষ<span class=\"en\">End of an āyah<\/span><\/td><td>থামা উত্তম<span class=\"en\">Stopping is best<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:22pt;color:#C0392B\">مـ<\/td><td>ওয়াকফে লাযিম<span class=\"en\">Compulsory stop<\/span><\/td><td>অবশ্যই থামতে হবে<span class=\"en\">Must stop<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:22pt;color:#C0392B\">لا<\/td><td>থামা নিষেধ<span class=\"en\">Do not stop<\/span><\/td><td>এখানে থেমে আবার শুরু করা যাবে না<span class=\"en\">Do not stop and restart here<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:22pt;color:#C0392B\">ج<\/td><td>জায়েয<span class=\"en\">Permissible<\/span><\/td><td>থামা বা মিলিয়ে পড়া দুটোই সমান<span class=\"en\">Stop or continue — equal<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:22pt;color:#C0392B\">صلى<\/td><td>মিলিয়ে পড়া উত্তম<span class=\"en\">Continue preferred<\/span><\/td><td>থামা যায়, তবে মিলিয়ে পড়া ভালো<span class=\"en\">Stopping allowed; continuing is better<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:22pt;color:#C0392B\">قلى<\/td><td>থামা উত্তম<span class=\"en\">Stop preferred<\/span><\/td><td>মিলিয়ে পড়া যায়, তবে থামা ভালো<span class=\"en\">Continuing allowed; stopping is better<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:22pt;color:#C0392B\">∴ ∴<\/td><td>মু‘আনাকা<span class=\"en\">Embracing stop<\/span><\/td><td>দুই চিহ্নের যেকোনো একটিতে থামবে, দুটোতে নয়<span class=\"en\">Stop at one of the two, not both<\/span><\/td><\/tr><\/table><div class=\"sl\"><b>কীভাবে থামবেন<\/b><i>How to stop<\/i><\/div><table class=\"t\"><tr><th>নং<\/th><th>নিয়ম<small>Rule<\/small><\/th><th>উদাহরণ<small>Example<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>শেষ হরফের হরকত সাকিন হয়ে যায়<span class=\"en\">The last vowel becomes a sukūn<\/span><\/td><td class=\"arcell\" style=\"font-size:18pt\">نَسۡتَعِينُ → نَسۡتَعِينْ<\/td><\/tr><tr><td class=\"no\">২<\/td><td>দুই যবর হলে এক আলিফ টেনে পড়া হয়<span class=\"en\">Double fatḥah becomes a 2-count “ā”<\/span><\/td><td class=\"arcell\" style=\"font-size:18pt\">عَلِيمًا → عَلِيمَا<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>গোল তা ( <span class=\"arx\">ة<\/span> ) হা সাকিন ( <span class=\"arx\">هْ<\/span> ) হয়ে যায়<span class=\"en\">Tāʾ marbūṭah becomes a sākin hāʾ<\/span><\/td><td class=\"arcell\" style=\"font-size:18pt\">ٱلۡقَارِعَةُ → ٱلۡقَارِعَهْ<\/td><\/tr><\/table><div class=\"tip\"><div class=\"ic\">!<\/div><div>উপমহাদেশীয় ছাপায় আরও কিছু চিহ্ন (<span class=\"arx\">ط ز ص ق<\/span>) থাকে; শিক্ষকের কাছ থেকে নিজের কুরআনের চিহ্নগুলো জেনে নিন।<span class=\"en\">Indo-Pak prints use extra signs (ṭ, z, ṣ, q); learn the signs of your own Muṣḥaf from your teacher.<\/span><\/div><\/div>"}, {"id": "l54", "bn": "অনুশীলনী — ৫", "en": "Review 5", "no": 51, "part": "পঞ্চম অংশ: তাজবীদের নিয়ম · Part 5: Rules of Tajwīd", "c": "#0E6B5C", "tint": "#EEF7F5", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫১<\/b><i>Lesson 51<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">অনুশীলনী — ৫<\/div><div class=\"e\">Review — Part 5<\/div><\/div><div class=\"badge\"><b>দিন ৫১<\/b><i>Day 51<\/i><\/div><\/div><div style=\"flex:1 1 0;display:flex;flex-direction:column\"><table class=\"ex\" style=\"height:100%\"><tr><td class=\"n\">প্রশ্ন ১<\/td><td>নূন সাকিন ও তানবীন কয় প্রকারে পড়া হয়?<span class=\"en\">Four rules of nūn sākinah?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ২<\/td><td>ইযহারের হরফ কয়টি ও কী কী?<span class=\"en\">Letters of iẓhār?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৩<\/td><td>ইদগাম কয় প্রকার? হরফগুলো বলো।<span class=\"en\">Kinds of idghām and its letters?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৪<\/td><td>ইকলাব কখন হয়?<span class=\"en\">When does iqlāb occur?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৫<\/td><td>কোন নিয়ম? সঠিকভাবে পড়ো।<span class=\"en\">Which rule? Read correctly.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">مِن قَبۡلِكَ · مِنۢ بَعۡدِ<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৬<\/td><td>মীম সাকিন কয় প্রকারে পড়া হয়?<span class=\"en\">Three rules of mīm sākinah?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৭<\/td><td>আল্লাহ শব্দের লাম পুর করে পড়ো।<span class=\"en\">Read with heavy lām.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">قَالَ ٱللَّهُ<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৮<\/td><td>রা কখন বারীক পড়তে হয়? দুইটি নিয়ম বলো।<span class=\"en\">Give two cases of light rāʾ.<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৯<\/td><td>এই চিহ্নগুলোর অর্থ বলো।<span class=\"en\">Meaning of these signs?<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">مـ  لا  ج  قلى<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ১০<\/td><td>ওয়াকফ করে পড়ো।<span class=\"en\">Read with a stop.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">ٱلرَّحِيمِ · عَلِيمًا<\/span><\/div><\/td><\/tr><\/table><\/div>"}, {"id": "l55", "bn": "সূরা আল-ফাতিহা — শব্দে শব্দে", "en": "Al-Fātiḥah word by word", "no": 52, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫২<\/b><i>Lesson 52<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">সূরা আল-ফাতিহা — শব্দে শব্দে<\/div><div class=\"e\">Al-Fātiḥah — Word by Word<\/div><\/div><div class=\"badge\"><b>দিন ৫২<\/b><i>Day 52<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : সূরা ফাতিহার গুরুত্ব কী?<\/p><p class=\"a\">উত্তর : সূরা ফাতিহা প্রতি রাকাত নামাজে পড়া হয়। রাসূল <span class=\"arx\">ﷺ<\/span> বলেছেন, যে সূরা ফাতিহা পড়ে না তার নামাজ হয় না (বুখারী ৭৫৬, মুসলিম ৩৯৪)।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: Why is Al-Fātiḥah important?<\/p><p class=\"a\">A: It is recited in every rakʿah. The Prophet <span class=\"arx\">ﷺ<\/span> said: there is no prayer for one who does not recite Al-Fātiḥah (Bukhārī 756, Muslim 394).<\/p><\/div><\/div><div class=\"grid zebra\" style=\"grid-template-columns:repeat(4,1fr);\"><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">بِسۡمِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱللَّهِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱلرَّحۡمَٰنِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱلرَّحِيمِ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">ٱلۡحَمۡدُ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">لِلَّهِ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">رَبِّ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">ٱلۡعَٰلَمِينَ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱلرَّحۡمَٰنِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱلرَّحِيمِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">مَٰلِكِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">يَوۡمِ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">ٱلدِّينِ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">إِيَّاكَ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">نَعۡبُدُ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">وَإِيَّاكَ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">نَسۡتَعِينُ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱهۡدِنَا<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱلصِّرَٰطَ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱلۡمُسۡتَقِيمَ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">صِرَٰطَ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">ٱلَّذِينَ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">أَنۡعَمۡتَ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">عَلَيۡهِمۡ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">غَيۡرِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">ٱلۡمَغۡضُوبِ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">عَلَيۡهِمۡ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:25pt\">وَلَا<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:25pt\">ٱلضَّآلِّينَ<\/div><\/div><div class=\"cell z\"><svg width=\"40\" viewBox=\"0 0 120 90\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g stroke=\"#5b3a1c\" stroke-width=\"1.2\" stroke-linejoin=\"round\">\n    <path d=\"M20 86 L66 40 L74 46 L30 88 Z\" fill=\"#a8743f\"/>\n    <path d=\"M100 86 L54 40 L46 46 L90 88 Z\" fill=\"#c08a4f\"/>\n  <\/g>\n  <path d=\"M14 44 Q36 30 60 40 Q84 30 106 44 L100 58 Q80 48 60 56 Q40 48 20 58 Z\" fill=\"#0B4A3E\" stroke=\"#062d25\" stroke-width=\"1.2\"/>\n  <path d=\"M20 40 Q38
