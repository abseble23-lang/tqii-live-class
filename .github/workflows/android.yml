name: Build Android APKs

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release APKs (Live + Admin)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/tqii-release.jks
          KEYSTORE_PASSWORD: rEcKIMPorhT-521vQ9Pj9yZc
          KEY_ALIAS: tqii
          KEY_PASSWORD: rEcKIMPorhT-521vQ9Pj9yZc
        run: gradle assembleLiveRelease assembleAdminRelease --stacktrace

      - name: Collect APKs
        run: |
          cp android/app/build/outputs/apk/live/release/app-live-release.apk TQII-Live-Class.apk
          cp android/app/build/outputs/apk/admin/release/app-admin-release.apk TQII-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TQII-apks
          path: "*.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TQII v1.0.${{ github.run_number }}
          body: |
            TQII Live Class (teachers & students): TQII-Live-Class.apk
            TQII Admin (administrators): TQII-Admin.apk
          files: |
            TQII-Live-Class.apk
            TQII-Admin.apk
          make_latest: true
