<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TQII Qaida</title>
<link rel="stylesheet" href="fonts.css"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#003B32"><link rel="icon" href="icons/icon-192.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes">
<style>
/* VOICE: calm, respectful classroom companion — the printed TQII Qaida brought to life
   IDEA: the book itself — each lesson is a page of the Qaida; tap any line and it speaks
   PICTURE: the lesson page (letter grids, Q&A boxes) is the picture, under a slim emerald bar
   COLOUR and TYPE: deep emerald #003B32 + luxury gold #D4AF37 on white paper; Anek Bangla, Hind Siliguri, Amiri Quran
   LAYOUT: top bar (voice language switch) · page card · sticky lesson nav; home = parts list */

:root{color-scheme:light dark;--bg:light-dark(#EEF3F0,#08201b);--ink:light-dark(#14211f,#e7efec);--muted:light-dark(#5b6966,#a9bab5);
 --em:#003B32;--em2:#0B4A3E;--gold:#D4AF37;--goldd:#9A7B1C;--card:light-dark(#fff,#10302a);--line:light-dark(#d5e2dd,#24463e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Hind Siliguri',sans-serif;overflow-x:clip}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[data-say]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{position:sticky;top:0;z-index:20;background:var(--em);color:#fff;border-bottom:3px solid var(--gold)}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:8px max(3vw,12px)}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;padding:0;text-align:left}
.brand img{width:42px;height:42px}
.brand b{display:block;font-family:'Anek Bangla';font-size:18px;line-height:1.1}
.brand small{font-family:Cinzel;letter-spacing:2px;color:var(--gold);font-size:11px}
.sp{flex:1}
.lang{display:flex;background:rgba(255,255,255,.1);border:1px solid rgba(212,175,55,.6);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#e9efe9;border-radius:999px;padding:8px 14px;min-height:40px;font-weight:600;font-size:14px}
.lang button[aria-pressed=true]{background:var(--gold);color:#002a23}
.ib{border:1px solid rgba(212,175,55,.6);background:rgba(255,255,255,.08);color:#fff;border-radius:12px;min-width:44px;min-height:44px;display:grid;place-items:center}
.ib svg{width:22px;height:22px}
.wrap{max-width:1100px;margin:0 auto;padding:18px max(3vw,12px) 110px}
.notice{background:#FFF4D6;color:#5a4300;border:1px solid #e5c76b;border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px;display:none}
.notice.on{display:block}
/* home */
.hero{background:radial-gradient(120% 120% at 70% 10%,#0a6150,#003B32 55%,#001E19);color:#fff;border-radius:22px;padding:clamp(20px,4vw,40px);display:grid;grid-template-columns:auto 1fr;gap:clamp(16px,3vw,36px);align-items:center;border:2px solid var(--gold);position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:8px;border:1px solid rgba(212,175,55,.45);border-radius:16px;pointer-events:none}
.hero img{width:clamp(110px,18vw,170px);filter:drop-shadow(0 0 22px rgba(212,175,55,.35))}
.hero h1{font-family:'Anek Bangla';font-weight:800;font-size:clamp(30px,5vw,50px);line-height:1.05;margin:0}
.hero .en{font-family:Cinzel;letter-spacing:4px;color:var(--gold);font-size:clamp(14px,2vw,20px);margin:6px 0 10px}
.hero p{margin:0 0 14px;color:#d9e8e2;max-width:60ch}
.cta{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:12px 18px;min-height:46px;font-weight:700;background:var(--gold);color:#002a23}
.btn.ghost{background:transparent;color:#fff;border:1px solid rgba(212,175,55,.7)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 6px}
.how div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14.5px}
.how b{display:block;color:light-dark(var(--em2),#7fd3bd);font-family:'Anek Bangla';font-size:16px}
.how span{display:block;font-family:Montserrat;font-size:12.5px;color:var(--muted)}
.part{margin-top:26px}
.part h2{font-family:'Anek Bangla';font-size:21px;margin:0 0 2px;color:light-dark(var(--em2),#9fe3cf)}
.part h2 small{display:block;font-family:Montserrat;font-weight:600;font-size:12px;color:var(--goldd)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.lc{display:flex;gap:12px;align-items:center;text-align:left;background:var(--card);color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:10px 12px;min-height:64px}
.lc .n{flex:none;width:40px;height:40px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-weight:700;font-family:'Anek Bangla'}
.lc b{display:block;font-size:15.5px;line-height:1.25}
.lc small{font-family:Montserrat;font-size:12px;color:var(--muted)}
.lc.done .n{background:var(--gold);color:#002a23}
.lc.done .n:after{content:" ✓"}
/* lesson page */
.paper{background:#fff;color:#1b2624;border-radius:18px;border:2px solid var(--c);box-shadow:0 0 0 5px #fff,0 0 0 6px var(--gold),0 14px 40px rgba(0,0,0,.18);padding:clamp(12px,2.6vw,30px);margin:6px 4px 0;position:relative}
.paper .content{display:flex;flex-direction:column;gap:0}
.paper .content>*{flex:none!important;height:auto!important}
.paper .grid{grid-auto-rows:minmax(84px,auto);min-height:0}
.paper .exm{grid-auto-rows:minmax(90px,auto)!important}
.paper .lh .badge{min-width:0}
.lessonbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:4px 4px 14px}
.lessonbar .t{flex:1}
.lessonbar .t small{display:block;font-family:Montserrat;font-size:12px;color:var(--muted)}
.lessonbar .t b{font-family:'Anek Bangla';font-size:19px}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:44px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.pill svg{width:18px;height:18px}
.pill.gold{background:var(--gold);border-color:var(--gold);color:#002a23}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--em);border-top:3px solid var(--gold)}
.nav .in{max-width:1100px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:8px max(3vw,12px)}
.nav .mid{flex:1;text-align:center;color:#e3efe9;font-size:14px}
.nav .mid b{color:var(--gold)}
.nav button{min-height:46px;border-radius:12px;border:1px solid rgba(212,175,55,.7);background:rgba(255,255,255,.08);color:#fff;padding:0 16px;font-weight:700}
.nav button.done{background:var(--gold);color:#002a23}
/* speakable */
[data-say]{cursor:pointer;border-radius:8px;transition:background .15s, box-shadow .15s}
[data-say]:hover{background:rgba(212,175,55,.12)}
.speaking{background:rgba(212,175,55,.28)!important;box-shadow:0 0 0 2px var(--gold) inset}
.sayrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.say{border:1px solid var(--c);color:var(--c);background:#fff;border-radius:999px;padding:4px 12px 4px 8px;min-height:36px;font-size:13.5px;font-weight:700;display:inline-flex;gap:6px;align-items:center}
.say svg{width:16px;height:16px}
.say.en{font-family:Montserrat;font-size:12.5px}
.classmode .paper{font-size:118%}
.classmode .paper .g{transform:scale(1.12)}
/* settings */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .box{background:var(--card);color:var(--ink);width:min(560px,100%);border-radius:20px 20px 0 0;padding:20px;border-top:4px solid var(--gold);max-height:90vh;overflow:auto}
.sheet h3{font-family:'Anek Bangla';margin:0 0 10px}
.sheet label{display:block;font-weight:600;margin:12px 0 4px}
.sheet select,.sheet input[type=range]{width:100%;font-size:16px;min-height:44px}
.sheet select{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--bg);color:var(--ink)}
.sheet .hint{font-size:13.5px;color:var(--muted);margin-top:6px}
@media (max-width:700px){
 .how{grid-template-columns:1fr}
 .brand span{display:none} .top .in{gap:8px} .lessonbar .t{display:none} .lessonbar{justify-content:space-between} .nav .in{gap:6px} .nav button{padding:0 10px;font-size:14px} .nav .mid{font-size:12px}
 .lang button{padding:8px 10px;font-size:13px}
 .paper .grid[style*="repeat(5"],.paper .grid[style*="repeat(6"],.paper .grid[style*="repeat(7"],.paper .grid[style*="repeat(8"]{grid-template-columns:repeat(4,minmax(0,1fr))!important}
 .paper .exm[style*="repeat(4"],.paper .exm[style*="repeat(6"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .paper .two,.paper .qa{grid-template-columns:1fr!important}
 .paper .qa .bnq{border-right:0;border-bottom:.3mm solid var(--c)}
 .paper .cart .t{font-size:15pt}
 .paper .badge{display:none}
 .paper [style*="repeat(5,1fr)"],.paper [style*="repeat(4,1fr)"]{grid-template-columns:repeat(2,minmax(0,1fr))!important}
 .paper table{font-size:13px}
 .paper .g{font-size:min(1em,9vw)}
 .hero{grid-template-columns:1fr;text-align:center} .hero img{margin:0 auto} .cta{justify-content:center}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- book components (from the printed Qaida) ---- */

* { box-sizing: border-box; }


:root { --em:#0B4A3E; --em2:#003B32; --gold:#C9A227; --goldd:#9A7B1C; --ink:#123A63; --c:#0B4A3E; --tint:#F1F7F4; }

/* frame */

/* lesson header */
.lh { display:flex; align-items:center; justify-content:space-between; margin-bottom:3.2mm; }
.badge { border:.45mm solid var(--c); color:var(--c); border-radius:2mm; padding:1mm 2.6mm .6mm; text-align:center; min-width:24mm; background:#fff; line-height:1.05; }
.badge b { display:block; font-family:'Anek Bangla'; font-weight:700; font-size:13pt; }
.badge i { display:block; font-style:normal; font-family:'Montserrat'; font-weight:700; font-size:6.6pt; letter-spacing:1px; color:var(--goldd); text-transform:uppercase; }
.cart { position:relative; flex:1; margin:0 3mm; height:19mm; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.cart svg { position:absolute; inset:0; width:100%; height:100%; }
.cart .t { position:relative; font-family:'Anek Bangla'; font-weight:700; font-size:17pt; color:var(--c); line-height:1.1; }
.cart .e { position:relative; font-family:'Playfair Display'; font-style:italic; font-size:9.2pt; color:var(--goldd); margin-top:.3mm; }

/* Q&A box */
.qa { display:grid; grid-template-columns:1fr 1fr; gap:0; border:.3mm solid var(--c); border-radius:2mm; overflow:hidden; margin-bottom:3mm; }
.qa > div { padding:1.8mm 3mm; }
.qa .bnq { background:var(--tint); border-right:.3mm solid var(--c); }
.qa .enq { background:#FFFCF2; }
.qa p { margin:0; font-size:10.4pt; line-height:1.45; }
.qa .q { color:#A3253A; font-weight:600; }
.qa .a { color:#183a6b; }
.qa .enq p { font-family:'Montserrat'; font-size:8.4pt; line-height:1.5; }
.qa .enq .q { color:#8a5a00; }
.qa.single { grid-template-columns:1fr; }

.ar { font-family:'QArabic'; direction:rtl; unicode-bidi:isolate; line-height:normal; }
.arx { font-family:'QArabic'; font-size:1.25em; line-height:1; unicode-bidi:isolate; direction:rtl; color:var(--ink); }
.hl { color:#C0392B; }
.hl2 { color:#1F7A4D; }

/* letter grids */
.grid { display:grid; direction:rtl; border-top:.3mm solid var(--c); border-left:.3mm solid var(--c); flex:1; }
.grid .cell { border-right:.3mm solid var(--c); border-bottom:.3mm solid var(--c); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1mm; direction:ltr; position:relative; }
.grid .cell:nth-child(odd) { }
.grid .cell .g { font-family:'QArabic'; direction:rtl; color:var(--ink); line-height:1.75; white-space:nowrap; }
.grid .cell .s1 { font-size:9pt; color:#3c4a47; font-weight:600; line-height:1.1; }
.grid .cell .s2 { font-family:'Montserrat'; font-size:7pt; color:var(--goldd); font-weight:600; letter-spacing:.3px; line-height:1.3; }
.grid .cell .num { position:absolute; top:.8mm; right:1.4mm; font-size:7pt; color:#9aa5a2; }
.grid.zebra .cell.z { background:var(--tint); }

/* section label */
.sl { display:flex; align-items:center; gap:2.5mm; margin:1.2mm 0 2mm; }
.sl b { font-family:'Anek Bangla'; font-weight:700; color:var(--c); font-size:12pt; white-space:nowrap; }
.sl i { font-style:normal; font-family:'Montserrat'; font-size:7.6pt; color:var(--goldd); font-weight:600; letter-spacing:.8px; text-transform:uppercase; white-space:nowrap; }
.sl::after { content:""; flex:1; height:.3mm; background:linear-gradient(90deg,var(--gold),transparent); }

/* tip strip */
.tip { margin-top:2.6mm; display:flex; gap:2.5mm; align-items:flex-start; background:#FFF8E6; border-left:1.4mm solid var(--gold); border-radius:1.5mm; padding:1.6mm 3mm; font-size:9pt; line-height:1.45; }
.tip .ic { flex:none; width:6mm; height:6mm; border-radius:50%; background:var(--gold); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:9pt; margin-top:.4mm; }
.tip .en { display:block; font-family:'Montserrat'; font-size:7.6pt; color:#6b5a2a; }

/* tables */
table.t { width:100%; border-collapse:collapse; font-size:9.6pt; }
table.t th { background:var(--c); color:#fff; font-weight:600; padding:1.4mm 2mm; border:.3mm solid var(--c); font-size:9.4pt; }
table.t th small { display:block; font-family:'Montserrat'; font-weight:500; font-size:6.8pt; color:#f1e2a8; letter-spacing:.4px; }
table.t td { border:.3mm solid #b9cbc4; padding:1.2mm 2mm; vertical-align:middle; line-height:1.35; }
table.t tr:nth-child(even) td { background:var(--tint); }
table.t .en { display:block; font-family:'Montserrat'; font-size:7.4pt; color:#62706c; line-height:1.35; }
table.t .arcell { font-family:'QArabic'; direction:rtl; text-align:center; color:var(--ink); font-size:20pt; white-space:nowrap; line-height:1.45; }
table.t .no { text-align:center; font-weight:700; color:var(--c); width:9mm; }

.exm { display:grid; gap:0; border-top:.3mm solid var(--c); border-left:.3mm solid var(--c); direction:rtl; }
.exm .e { border-right:.3mm solid var(--c); border-bottom:.3mm solid var(--c); padding:1.6mm 2mm 1.2mm; text-align:center; direction:ltr; display:flex; flex-direction:column; justify-content:center; }
.exm .e .g { font-family:'QArabic'; direction:rtl; font-size:25pt; color:var(--ink); line-height:1.6; }
.exm .e .r { font-family:'Montserrat'; font-size:6.8pt; color:#8a8a8a; }

.body p { margin:0 0 1.8mm; font-size:10.2pt; line-height:1.6; text-align:justify; }
.body .en p, p.en { font-family:'Montserrat'; font-size:8.3pt; line-height:1.55; color:#384543; }
.two { display:grid; grid-template-columns:1fr 1fr; gap:4mm; }
.card { border:.3mm solid var(--c); border-radius:2mm; padding:2mm 3mm; background:#fff; }
.card h4 { margin:0 0 1mm; font-family:'Anek Bangla'; font-size:11.5pt; color:var(--c); }
.card h4 small { font-family:'Montserrat'; font-weight:600; font-size:7.4pt; color:var(--goldd); margin-left:1.5mm; letter-spacing:.4px; }
ol.list, ul.list { margin:0; padding-left:5mm; font-size:9.8pt; line-height:1.55; }
ol.list li, ul.list li { margin-bottom:.8mm; }
ol.list li .en, ul.list li .en { display:block; font-family:'Montserrat'; font-size:7.6pt; color:#62706c; line-height:1.4; }

/* exercise */
table.ex { width:100%; border-collapse:collapse; }
table.ex td { border:.3mm solid var(--c); padding:3.4mm 2.4mm; font-size:10pt; vertical-align:middle; }
table.ex td.n { width:15mm; text-align:center; font-weight:700; color:var(--c); background:var(--tint); white-space:nowrap; }
table.ex td .en { font-family:'Montserrat'; font-size:7.6pt; color:#6b5a2a; display:block; }
table.ex td.w { width:34%; }
table.ex .lines { height:9mm; background:repeating-linear-gradient(transparent 0 7.5mm, #c9d6d1 7.5mm 7.8mm); }

.arx{font-family:'QArabic';font-size:1.18em;line-height:1;color:inherit}
.ar .arx,.g .arx,.arcell .arx,.exm .arx,.sar .arx,svg .arx{font-size:1em;line-height:inherit}

.sbox{border:.35mm solid var(--c);border-radius:2mm;overflow:hidden;margin-bottom:3mm;background:#fff}
.sbox .sh{background:var(--c);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:1.2mm 3mm}
.sbox .sh b{font-family:'Anek Bangla';font-size:12.5pt}
.sbox .sh span{font-family:'Montserrat';font-size:7.6pt;color:#f3e3ab;letter-spacing:.4px}
.sar{color:#123A63;text-align:center;line-height:1.95;padding:1mm 4mm 2mm}
.an{color:#9A7B1C;font-size:.72em}
table.st td{font-size:9pt}
table.st td.ent{font-family:'Montserrat';font-size:7.4pt;color:#4a5553}

table.pos td{padding:.2mm 1.5mm} table.pos td.pn{text-align:center;line-height:1.15} table.pos td.pn b{display:block;font-size:10.5pt;color:#0B4A3E} table.pos td.pn span{font-family:Montserrat;font-size:7pt;color:#9A7B1C} table.pos td.pc{text-align:center;direction:rtl} table.pos .pf{font-family:QArabic;font-size:20pt;color:#123A63;line-height:1.3} table.pos .pe{font-family:QArabic;font-size:14pt;color:#5d6b68;line-height:1.3;border-top:.25mm dashed #c9d6d1} table.pos td.pa .pf{font-size:26pt} table.mo td{padding:3mm 2.2mm} table.mk td{padding:3.2mm 2.4mm} table.mk .en{font-size:8pt} table.prog{font-size:8pt} table.prog td{padding:.45mm 1.6mm;height:6.6mm} table.key .arcell{font-size:16pt;line-height:1.35} table.key td{padding:.6mm 2mm} table.toc{font-size:8pt} table.toc td{padding:.25mm 2mm;border:.25mm solid #d3e0db} table.toc tr:nth-child(even) td{background:#fff}

.qa > div{padding:8px 12px}

<script>
{
const L = [{"id": "l1", "bn": "ভূমিকা ও কুরআন শিক্ষার ফজিলত", "en": "Foreword & virtues", "no": null, "part": "শুরুর কথা · Getting started", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"cart\" style=\"margin:0 18mm\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">ভূমিকা ও কুরআন শিক্ষার ফজিলত<\/div><div class=\"e\">Foreword & the Virtue of Learning the Quran<\/div><\/div><\/div>\n<div class=\"body two\" style=\"gap:5mm\">\n <div><p>আলহামদুলিল্লাহ। কুরআনুল কারীম শুদ্ধভাবে পড়তে পারা প্রত্যেক মুসলমানের জন্য অত্যন্ত গুরুত্বপূর্ণ। <b>তালিমুল কোরআন কায়দা<\/b> এমনভাবে সাজানো হয়েছে যাতে শিশু, কিশোর ও বয়স্ক — যেকোনো বয়সের শিক্ষার্থী আরবি হরফ চেনা থেকে শুরু করে তাজবীদসহ কুরআন তিলাওয়াত পর্যন্ত ধাপে ধাপে পৌঁছাতে পারেন।<\/p>\n <p>প্রতিটি পাঠে প্রথমে প্রশ্নোত্তরের মাধ্যমে নিয়মটি বোঝানো হয়েছে, তারপর ছবি ও উদাহরণ এবং সবশেষে মাশক (অনুশীলন)। প্রতিটি অংশ শেষে রয়েছে অনুশীলনী, যাতে শিক্ষক শিক্ষার্থীর অগ্রগতি যাচাই করতে পারেন।<\/p>\n <p>তাজবীদের উদাহরণগুলো সরাসরি কুরআনুল কারীম থেকে নেওয়া হয়েছে এবং প্রতিটির পাশে সূরা ও আয়াত নম্বর দেওয়া আছে।<\/p><\/div>\n <div class=\"en\"><p>All praise is due to Allah. Reading the Noble Quran correctly is a precious duty for every Muslim. The <b>TQII Qaida<\/b> is designed for learners of every age — children, teenagers and adults — and leads step by step from recognising the Arabic letters to reciting the Quran with tajwīd.<\/p>\n <p>Every lesson first explains the rule as a short question and answer in Bangla and English, then shows it with illustrations and examples, and ends with practice (mashq). Review exercises close each part.<\/p>\n <p>All tajwīd examples are taken directly from the Quran, with the sūrah and āyah number shown beside each one.<\/p><\/div>\n<\/div>\n<div class=\"sl\"><b>কুরআন শিক্ষার ফজিলত<\/b><i>Virtues from authentic ḥadīth<\/i><\/div><div class=\"card\" style=\"margin-bottom:2.4mm\"><div class=\"ar\" style=\"font-size:17pt;color:#123A63;text-align:center;line-height:1.7\">خَيۡرُكُمۡ مَنۡ تَعَلَّمَ الۡقُرۡآنَ وَعَلَّمَهُ<\/div>\n       <p style=\"margin:.6mm 0 0;font-size:9.8pt\">তোমাদের মধ্যে সর্বোত্তম সেই ব্যক্তি, যে কুরআন শেখে এবং অন্যকে শেখায়।<\/p><p class=\"en\" style=\"margin:0\">The best of you are those who learn the Quran and teach it.<\/p>\n       <div style=\"font-size:7.8pt;color:#9A7B1C;text-align:right;font-weight:600\">সহীহ বুখারী, হাদিস ৫০২৭ · Ṣaḥīḥ al-Bukhārī 5027<\/div><\/div><div class=\"card\" style=\"margin-bottom:2.4mm\"><div class=\"ar\" style=\"font-size:17pt;color:#123A63;text-align:center;line-height:1.7\">الۡمَاهِرُ بِالۡقُرۡآنِ مَعَ السَّفَرَةِ الۡكِرَامِ الۡبَرَرَةِ، وَالَّذِي يَقۡرَأُ الۡقُرۡآنَ وَيَتَتَعۡتَعُ فِيهِ وَهُوَ عَلَيۡهِ شَاقٌّ لَهُ أَجۡرَانِ<\/div>\n       <p style=\"margin:.6mm 0 0;font-size:9.8pt\">কুরআনে দক্ষ ব্যক্তি সম্মানিত পুণ্যবান ফেরেশতাদের সঙ্গে থাকবে; আর যে কষ্ট করে আটকে আটকে কুরআন পড়ে, তার জন্য রয়েছে দ্বিগুণ সওয়াব।<\/p><p class=\"en\" style=\"margin:0\">The one skilled in the Quran is with the noble, righteous scribes; and the one who reads it with difficulty, stammering, has a double reward.<\/p>\n       <div style=\"font-size:7.8pt;color:#9A7B1C;text-align:right;font-weight:600\">সহীহ বুখারী ৪৯৩৭; সহীহ মুসলিম ৭৯৮ · Bukhārī 4937; Muslim 798<\/div><\/div><div class=\"card\" style=\"margin-bottom:2.4mm\"><div class=\"ar\" style=\"font-size:17pt;color:#123A63;text-align:center;line-height:1.7\">مَنۡ قَرَأَ حَرۡفًا مِنۡ كِتَابِ اللَّهِ فَلَهُ بِهِ حَسَنَةٌ، وَالۡحَسَنَةُ بِعَشۡرِ أَمۡثَالِهَا<\/div>\n       <p style=\"margin:.6mm 0 0;font-size:9.8pt\">যে আল্লাহর কিতাবের একটি হরফ পড়ে, তার জন্য একটি নেকি; আর প্রতিটি নেকি দশগুণ।<\/p><p class=\"en\" style=\"margin:0\">Whoever reads a letter from the Book of Allah earns a good deed, and a good deed is multiplied tenfold.<\/p>\n       <div style=\"font-size:7.8pt;color:#9A7B1C;text-align:right;font-weight:600\">জামে তিরমিযী ২৯১০ (হাসান সহীহ) · Jāmiʿ at-Tirmidhī 2910<\/div><\/div>"}, {"id": "l2", "bn": "কায়দাটি যেভাবে ব্যবহার করবেন", "en": "How to use this qaida", "no": null, "part": "শুরুর কথা · Getting started", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"cart\" style=\"margin:0 18mm\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">কায়দাটি যেভাবে ব্যবহার করবেন<\/div><div class=\"e\">How to Use This Qaida<\/div><\/div><\/div>\n<div class=\"two\">\n <div class=\"card\"><h4>শিক্ষকের জন্য <small>FOR THE TEACHER<\/small><\/h4><ol class=\"list\">\n  <li>প্রতিদিন একটি পাঠ; আগের পাঠ পুনরায় শুনে তারপর নতুন পাঠ শুরু করুন।<span class=\"en\">One lesson a day; revise the previous lesson before starting a new one.<\/span><\/li>\n  <li>প্রথমে নিজে উচ্চারণ করে শোনান, তারপর শিক্ষার্থীকে দিয়ে পড়ান।<span class=\"en\">Model the sound first, then let the learner repeat.<\/span><\/li>\n  <li>মাখরাজ দেখিয়ে দিন — মুখ, ঠোঁট ও জিহ্বার অবস্থান।<span class=\"en\">Show the point of articulation — mouth, lips and tongue.<\/span><\/li>\n  <li>লাল রঙে চিহ্নিত অংশে নিয়মটি প্রয়োগ হয়েছে।<span class=\"en\">Parts printed in red show where the rule applies.<\/span><\/li>\n  <li>অনুশীলনী পাতায় মৌখিক প্রশ্ন করুন ও অগ্রগতি তালিকা পূরণ করুন।<span class=\"en\">Ask the review questions orally and fill in the progress chart.<\/span><\/li>\n <\/ol><\/div>\n <div class=\"card\"><h4>শিক্ষার্থীর জন্য <small>FOR THE LEARNER<\/small><\/h4><ol class=\"list\">\n  <li>অজু করে, আদবের সাথে কায়দা পড়ুন।<span class=\"en\">Read with wuḍūʾ and respect.<\/span><\/li>\n  <li>ডান দিক থেকে বাম দিকে পড়ুন — আরবি ডান থেকে লেখা হয়।<span class=\"en\">Read right to left — Arabic is written from the right.<\/span><\/li>\n  <li>তাড়াহুড়া নয়; ধীরে, স্পষ্ট ও সঠিক মাখরাজে পড়ুন।<span class=\"en\">Don’t rush; read slowly, clearly and from the correct makhraj.<\/span><\/li>\n  <li>প্রতিদিন অল্প হলেও নিয়মিত অনুশীলন করুন।<span class=\"en\">Practise a little every day, consistently.<\/span><\/li>\n  <li>বড়দের জন্যও এই কায়দা — শেখার কোনো বয়স নেই।<span class=\"en\">This qaida is for adults too — learning has no age limit.<\/span><\/li>\n <\/ol><\/div>\n<\/div>\n<div class=\"sl\"><b>চিহ্ন ও রঙের অর্থ<\/b><i>Key to the symbols<\/i><\/div>\n<table class=\"t key\"><tr><th>চিহ্ন<small>Sign<\/small><\/th><th>বাংলা নাম<\/th><th>English name<\/th><th>কাজ · Function<\/th><\/tr>\n <tr><td class=\"arcell\">بَ<\/td><td>যবর<\/td><td>Fatḥah<\/td><td>খাটো ‘আ’ ধ্বনি<span class=\"en\">short “a”<\/span><\/td><\/tr>\n <tr><td class=\"arcell\">بِ<\/td><td>যের<\/td><td>Kasrah<\/td><td>খাটো ‘ই’ ধ্বনি<span class=\"en\">short “i”<\/span><\/td><\/tr>\n <tr><td class=\"arcell\">بُ<\/td><td>পেশ<\/td><td>Ḍammah<\/td><td>খাটো ‘উ’ ধ্বনি<span class=\"en\">short “u”<\/span><\/td><\/tr>\n <tr><td class=\"arcell\">بً بٍ بٌ<\/td><td>তানবীন<\/td><td>Tanwīn<\/td><td>শেষে ‘ন’ ধ্বনি যোগ হয়<span class=\"en\">adds an “n” sound<\/span><\/td><\/tr>\n <tr><td class=\"arcell\">بْ · بۡ<\/td><td>সাকিন / জযম<\/td><td>Sukūn<\/td><td>হরকতহীন; আগের হরফের সাথে মিলে<span class=\"en\">no vowel; joins the previous letter<\/span><\/td><\/tr>\n <tr><td class=\"arcell\">بّ<\/td><td>তাশদীদ<\/td><td>Shaddah<\/td><td>হরফ দুইবার পড়া হয়<span class=\"en\">letter is doubled<\/span><\/td><\/tr>\n <tr><td class=\"arcell\">بٰ  بٖ  بٗ<\/td><td>খাড়া যবর, খাড়া যের, উল্টা পেশ<\/td><td>Standing vowels<\/td><td>এক আলিফ টেনে<span class=\"en\">lengthen 1 alif<\/span><\/td><\/tr>\n <tr><td class=\"arcell\">آ<\/td><td>মদের চিহ্ন<\/td><td>Maddah sign<\/td><td>এক আলিফের বেশি টেনে (৩–৪ আলিফ)<span class=\"en\">stretch more than 1 alif<\/span><\/td><\/tr>\n<\/table>\n<div class=\"tip\"><div class=\"ic\">i<\/div><div><b>১ আলিফ<\/b> = একটি আঙুল স্বাভাবিক গতিতে ভাঁজ করার সময়। মদ টানার পরিমাণ এই বইয়ে আলিফ গুনে দেখানো হয়েছে।<span class=\"en\">1 alif ≈ the time to fold one finger at a normal pace. Madd lengths in this book are counted in alifs.<\/span><\/div><\/div>"}, {"id": "l3", "bn": "কুরআন তিলাওয়াতের আদব", "en": "Etiquette of recitation", "no": null, "part": "শুরুর কথা · Getting started", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"cart\" style=\"margin:0 18mm\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">কুরআন তিলাওয়াতের আদব<\/div><div class=\"e\">Etiquette of Reciting the Quran<\/div><\/div><\/div>\n<ol class=\"list\" style=\"columns:2;column-gap:7mm;font-size:11pt;line-height:1.75\"><li>আল্লাহর সন্তুষ্টির নিয়তে তিলাওয়াত করা।<span class=\"en\">Recite sincerely, for the pleasure of Allah.<\/span><\/li><li>পবিত্র অবস্থায়, অজুসহ কুরআন স্পর্শ করা।<span class=\"en\">Touch the Muṣḥaf in a state of purity, with wuḍūʾ.<\/span><\/li><li>মিসওয়াক বা ব্রাশ করে মুখ পরিষ্কার রাখা।<span class=\"en\">Keep the mouth clean (miswāk / brushing).<\/span><\/li><li>পরিষ্কার জায়গায় কিবলামুখী হয়ে বসা।<span class=\"en\">Sit in a clean place, facing the qiblah if possible.<\/span><\/li><li>শুরুতে আউযুবিল্লাহ ও বিসমিল্লাহ পড়া।<span class=\"en\">Begin with taʿawwudh and basmalah.<\/span><\/li><li>তারতীলের সাথে ধীরে ধীরে, শুদ্ধ উচ্চারণে পড়া।<span class=\"en\">Recite slowly with tartīl and correct pronunciation.<\/span><\/li><li>তিলাওয়াতের সময় অপ্রয়োজনীয় কথা না বলা।<span class=\"en\">Avoid needless talk while reciting.<\/span><\/li><li>কুরআন খোলা রেখে চলে না যাওয়া, উপরে কিছু না রাখা।<span class=\"en\">Do not leave the Muṣḥaf open or place things on it.<\/span><\/li><li>অর্থ বোঝার চেষ্টা ও আমল করার নিয়ত করা।<span class=\"en\">Try to understand it and intend to act upon it.<\/span><\/li><li>তিলাওয়াতের সিজদা এলে সিজদা আদায় করা।<span class=\"en\">Perform the prostration of recitation when it comes.<\/span><\/li><\/ol>\n<div class=\"sl\"><b>তিলাওয়াত শুরু করার আগে<\/b><i>Before you begin<\/i><\/div>\n<div class=\"card\" style=\"text-align:center;margin:2mm 0 5mm;padding:4mm\"><h4>তাআউয <small>TAʿAWWUDH<\/small><\/h4>\n <div class=\"ar\" style=\"font-size:32pt;color:#123A63;margin:3mm 0\">أَعُوذُ بِاللَّهِ مِنَ الشَّيۡطَانِ الرَّجِيمِ<\/div>\n <p style=\"margin:0;font-size:9.8pt\">আমি বিতাড়িত শয়তান থেকে আল্লাহর কাছে আশ্রয় চাই।<\/p>\n <p class=\"en\" style=\"margin:0\">I seek refuge with Allah from Satan, the accursed.<\/p>\n <div style=\"font-size:7.8pt;color:#9A7B1C\">নির্দেশ: সূরা আন-নাহল ১৬:৯৮ · Command: An-Naḥl 16:98<\/div><\/div>\n<div class=\"card\" style=\"text-align:center;padding:4mm;margin-bottom:3mm\"><h4>তাসমিয়া <small>BASMALAH<\/small><\/h4>\n <div class=\"ar\" style=\"font-size:34pt;color:#123A63;margin:3mm 0\">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<\/div>\n <p style=\"margin:0;font-size:9.8pt\">শুরু করছি আল্লাহর নামে যিনি পরম করুণাময়, অতি দয়ালু।<\/p>\n <p class=\"en\" style=\"margin:0\">In the name of Allah, the Entirely Merciful, the Especially Merciful<\/p>\n <div style=\"font-size:7.8pt;color:#9A7B1C\">সূরা আল-ফাতিহা ১:১ · Al-Fātiḥah 1:1<\/div><\/div>\n<div class=\"tip\"><div class=\"ic\">i<\/div><div>সূরা আত-তাওবার শুরুতে বিসমিল্লাহ পড়া হয় না।<span class=\"en\">The basmalah is not recited at the beginning of Sūrat at-Tawbah (9).<\/span><\/div><\/div>"}, {"id": "l4", "bn": "হরফের পরিচয়", "en": "The Arabic alphabet", "no": 1, "part": "প্রথম অংশ: হরফ ও মাখরাজ · Part 1: Letters & Articulation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ০১<\/b><i>Lesson 01<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">হরফের পরিচয়<\/div><div class=\"e\">The Arabic Alphabet<\/div><\/div><div class=\"badge\"><b>দিন ০১<\/b><i>Day 01<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : হরফ কাকে বলে? আরবি হরফ মোট কয়টি?<\/p><p class=\"a\">উত্তর : আরবি বর্ণমালার প্রতিটি অক্ষরকে হরফ বলে। আরবি হরফ মোট ২৯টি।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is a ḥarf? How many letters are there?<\/p><p class=\"a\">A: Each letter of the Arabic alphabet is a ḥarf. There are 29 letters.<\/p><\/div><\/div><div class=\"grid zebra\" style=\"grid-template-columns:repeat(5,1fr);\"><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ا<\/div><div class=\"s1\">আলিফ<\/div><div class=\"s2\">Alif<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ب<\/div><div class=\"s1\">বা<\/div><div class=\"s2\">Bā<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ت<\/div><div class=\"s1\">তা<\/div><div class=\"s2\">Tā<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ث<\/div><div class=\"s1\">ছা<\/div><div class=\"s2\">Thā<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ج<\/div><div class=\"s1\">জীম<\/div><div class=\"s2\">Jīm<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">ح<\/div><div class=\"s1\">হা<\/div><div class=\"s2\">Ḥā<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">خ<\/div><div class=\"s1\">খা<\/div><div class=\"s2\">Khā<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">د<\/div><div class=\"s1\">দাল<\/div><div class=\"s2\">Dāl<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">ذ<\/div><div class=\"s1\">যাল<\/div><div class=\"s2\">Dhāl<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">ر<\/div><div class=\"s1\">রা<\/div><div class=\"s2\">Rā<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ز<\/div><div class=\"s1\">যা<\/div><div class=\"s2\">Zāy<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">س<\/div><div class=\"s1\">সীন<\/div><div class=\"s2\">Sīn<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ش<\/div><div class=\"s1\">শীন<\/div><div class=\"s2\">Shīn<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ص<\/div><div class=\"s1\">সোয়াদ<\/div><div class=\"s2\">Ṣād<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:36pt\">ض<\/div><div class=\"s1\">দোয়াদ<\/div><div class=\"s2\">Ḍād<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">ط<\/div><div class=\"s1\">তোয়া<\/div><div class=\"s2\">Ṭā<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">ظ<\/div><div class=\"s1\">যোয়া<\/div><div class=\"s2\">Ẓā<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">ع<\/div><div class=\"s1\">আইন<\/div><div class=\"s2\">ʿAyn<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:36pt\">غ<\/div><div class=\"s1\">গাইন<\/d  Q80 44 98 52 Z\" fill=\"#fffaf0\" stroke=\"#cdbb86\" stroke-width=\".8\"/>\n  <g stroke=\"#b9a46a\" stroke-width=\".7\">\n    <path d=\"M27 41 Q40 34 55 39\"/><path d=\"M28 45 Q41 38 55 43\"/><path d=\"M93 41 Q80 34 65 39\"/><path d=\"M92 45 Q79 38 65 43\"/>\n  <\/g>\n  <path d=\"M60 36 L60 56\" stroke=\"#C9A227\" stroke-width=\"1.2\"/>\n<\/svg><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>ডান দিক থেকে পড়া শুরু করুন। প্রতিটি হরফের নিচে বাংলা ও ইংরেজি নাম দেওয়া আছে।<span class=\"en\">Start reading from the right. Each letter shows its Bangla and English name.<\/span><\/div><\/div>"}, {"id": "l5", "bn": "হরফের বিভিন্ন রূপ", "en": "Letter shapes", "no": 2, "part": "প্রথম অংশ: হরফ ও মাখরাজ · Part 1: Letters & Articulation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ০২<\/b><i>Lesson 02<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">হরফের বিভিন্ন রূপ<\/div><div class=\"e\">Letter Shapes — Joined Forms<\/div><\/div><div class=\"badge\"><b>দিন ০২<\/b><i>Day 02<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : হরফের রূপ বদলায় কেন?<\/p><p class=\"a\">উত্তর : আরবি হরফ শব্দে একটির সাথে আরেকটি যুক্ত হয়ে লেখা হয়, তাই অবস্থানভেদে আকৃতি কিছুটা বদলে যায়।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: Why do letters change shape?<\/p><p class=\"a\">A: Arabic letters join together in words, so their shape changes slightly with their position.<\/p><\/div><\/div><div class=\"two\" style=\"gap:3mm\"><table class=\"t\" style=\"font-size:8.8 =\"700\" fill=\"#b2442f\">২খ<\/tspan> হলকের মধ্যখান<\/text><text x=\"474\" y=\"324\" fill=\"#666\" font-family=\"Montserrat\" font-size=\"10\">mid throat · <tspan font-family=\"QArabic\" font-size=\"15\">ع ح<\/tspan><\/text>\n    <text x=\"474\" y=\"362\"><tspan font-weight=\"700\" fill=\"#b2442f\">২গ<\/tspan> হলকের শুরু<\/text><text x=\"474\" y=\"378\" fill=\"#666\" font-family=\"Montserrat\" font-size=\"10\">deep throat · <tspan font-family=\"QArabic\" font-size=\"15\">ء ه<\/tspan><\/text>\n  <\/g>\n<\/svg><\/div><div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:2mm\"><div class=\"card\" style=\"text-align:center;border-top:1.6mm solid #9A7B1C;padding:1.6mm\"><div style=\"width:8mm;height:8mm;border-radius:50%;background:#9A7B1C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 1mm\">১<\/div><b style=\"color:#9A7B1C;font-size:12pt\">জাওফ<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C;font-weight:600\">Al-Jawf<\/div><div style=\"font-size:8.8pt;line-height:1.35;margin-top:1mm\">মুখ ও গলার খালি জায়গা — মদের হরফ<\/div><div style=\"font-family:Montserrat;font-size:6.8pt;color:#666;line-height:1.35\">Empty space of mouth & throat — madd letters<\/div><\/div><div class=\"card\" style=\"text-align:center;border-top:1.6mm solid #b2442f;padding:1.6mm\"><div style=\"width:8mm;height:8mm;border-radius:50%;background:#b2442f;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 1mm\">২<\/div><b style=\"color:#b2442f;font-size:12pt\">হলক<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C;font-weight:600\">Al-Ḥalq<\/div><div style=\"font-size:8.8pt;line-height:1.35;margin-top:1mm\">কণ্ঠনালী — ৬টি হরফ (৩টি স্থান)<\/div><div style=\"font-family:Montserrat;font-size:6.8pt;color:#666;line-height:1.35\">Throat — 6 letters (3 points)<\/div><\/div><div class=\"card\" style=\"text-align:center;border-top:1.6mm solid #a4404d;padding:1.6mm\"><div style=\"width:8mm;height:8mm;border-radius:50%;background:#a4404d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 1mm\">৩<\/div><b style=\"color:#a4404d;font-size:12pt\">লিসান<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C;font-weight:600\">Al-Lisān<\/div><div style=\"font-size:8.8pt;line-height:1.35;margin-top:1mm\">জিহ্বা — ১৮টি হরফ (১০টি স্থান)<\/div><div style=\"font-family:Montserrat;font-size:6.8pt;color:#666;line-height:1.35\">Tongue — 18 letters (10 points)<\/div><\/div><div class=\"card\" style=\"text-align:center;border-top:1.6mm solid #9c3b47;padding:1.6mm\"><div style=\"width:8mm;height:8mm;border-radius:50%;background:#9c3b47;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 1mm\">৪<\/div><b style=\"color:#9c3b47;font-size:12pt\">শাফাতান<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C;font-weight:600\">Ash-Shafatān<\/div><div style=\"font-size:8.8pt;line-height:1.35;margin-top:1mm\">দুই ঠোঁট — ৪টি হরফ (২টি স্থান)<\/div><div style=\"font-family:Montserrat;font-size:6.8pt;color:#666;line-height:1.35\">Lips — 4 letters (2 points)<\/div><\/div><div class=\"card\" style=\"text-align:center;border-top:1.6mm solid #3f6f9a;padding:1.6mm\"><div style=\"width:8mm;height:8mm;border-radius:50%;background:#3f6f9a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;margin:0 auto 1mm\">৫<\/div><b style=\"color:#3f6f9a;font-size:12pt\">খাইশুম<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#9A7B1C;font-weight:600\">Al-Khayshūm<\/div><div style=\"font-size:8.8pt;line-height:1.35;margin-top:1mm\">নাকের বাঁশি — গুন্নাহ<\/div><div style=\"font-family:Montserrat;font-size:6.8pt;color:#666;line-height:1.35\">Nasal passage — ghunnah<\/div><\/div><\/div><div style=\"flex:1\"><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>আয়নার সামনে বসে নিজের ঠোঁট ও জিহ্বার অবস্থান দেখে দেখে অনুশীলন করুন।<span class=\"en\">Practise in front of a mirror and watch your lips and tongue.<\/span><\/div><\/div>"}, {"id": "l7", "bn": "১৭ মাখরাজ (১)", "en": "The 17 makhārij", "no": 4, "part": "প্রথম অংশ: হরফ ও মাখরাজ · Part 1: Letters & Articulation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ০৪<\/b><i>Lesson 04<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">১৭ মাখরাজ (১)<\/div><div class=\"e\">The 17 Makhārij (I)<\/div><\/div><div class=\"badge\"><b>দিন ০৪<\/b><i>Day 04<\/i><\/div><\/div><table class=\"t mk\" style=\"font-size:11pt\"><tr><th>নং<\/th><th>উচ্চারণের স্থান<small>Point of articulation<\/small><\/th><th style=\"width:34mm\">হরফ<small>Letters<\/small><\/th><\/tr><tr><td class=\"no\">০১<\/td><td>হলকের শুরু (বুকের দিক) থেকে<span class=\"en\">From the deepest part of the throat<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ء ه<\/td><\/tr><tr><td class=\"no\">০২<\/td><td>হলকের মধ্যখান থেকে<span class=\"en\">From the middle of the throat<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ع ح<\/td><\/tr><tr><td class=\"no\">০৩<\/td><td>হলকের শেষ (মুখের দিক) থেকে<span class=\"en\">From the top of the throat (nearest the mouth)<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">غ خ<\/td><\/tr><tr><td class=\"no\">০৪<\/td><td>জিহ্বার গোড়া তার বরাবর উপরের তালুর সঙ্গে লাগিয়ে<span class=\"en\">Back of the tongue against the soft palate above it<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ق<\/td><\/tr><tr><td class=\"no\">০৫<\/td><td>জিহ্বার গোড়া থেকে একটু আগে, তার বরাবর উপরের তালুর সঙ্গে লাগিয়ে<span class=\"en\">Back of the tongue, slightly forward of qāf, against the palate<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ك<\/td><\/tr><tr><td class=\"no\">০৬<\/td><td>জিহ্বার মধ্যখান তার বরাবর উপরের তালুর সঙ্গে লাগিয়ে<span class=\"en\">Middle of the tongue against the hard palate<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ج ش ي<\/td><\/tr><tr><td class=\"no\">০৭<\/td><td>জিহ্বার গোড়ার কিনারা উপরের মাড়ির দাঁতের সঙ্গে লাগিয়ে<span class=\"en\">Side edge of the tongue against the upper molars<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ض<\/td><\/tr><tr><td class=\"no\">০৮<\/td><td>জিহ্বার আগার কিনারা সামনের উপরের দাঁতের মাড়ির সঙ্গে লাগিয়ে<span class=\"en\">Front edge of the tongue against the gums of the upper front teeth<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ل<\/td><\/tr><tr><td class=\"no\">০৯<\/td><td>জিহ্বার আগা তার বরাবর উপরের তালুর সঙ্গে লাগিয়ে<span class=\"en\">Tip of the tongue against the gum ridge (just below lām’s point)<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ن<\/td><\/tr><\/table><div class=\"tip\"><div class=\"ic\">!<\/div><div>হলকের ৬টি হরফ (<span class=\"arx\">ء ه ع ح غ خ<\/span>)-কে <b>হুরূফে হলকী<\/b> বলা হয়।<span class=\"en\">The six throat letters are called ḥurūf al-ḥalq.<\/span><\/div><\/div>"}, {"id": "l8", "bn": "১৭ মাখরাজ (২)", "en": "The 17 makhārij", "no": 5, "part": "প্রথম অংশ: হরফ ও মাখরাজ · Part 1: Letters & Articulation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ০৫<\/b><i>Lesson 05<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">১৭ মাখরাজ (২)<\/div><div class=\"e\">The 17 Makhārij (II)<\/div><\/div><div class=\"badge\"><b>দিন ০৫<\/b><i>Day 05<\/i><\/div><\/div><table class=\"t mk\" style=\"font-size:11pt\"><tr><th>নং<\/th><th>উচ্চারণের স্থান<small>Point of articulation<\/small><\/th><th style=\"width:34mm\">হরফ<small>Letters<\/small><\/th><\/tr><tr><td class=\"no\">১০<\/td><td>জিহ্বার আগার পিঠ তার বরাবর উপরের তালুর সঙ্গে লাগিয়ে<span class=\"en\">Tip of the tongue with a little of its back, against the gum ridge<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ر<\/td><\/tr><tr><td class=\"no\">১১<\/td><td>জিহ্বার আগা সামনের উপরের দুই দাঁতের গোড়ার সঙ্গে লাগিয়ে<span class=\"en\">Tip of the tongue against the roots of the upper front teeth<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ت د ط<\/td><\/tr><tr><td class=\"no\">১২<\/td><td>জিহ্বার আগা সামনের নিচের দুই দাঁতের পেট ও আগার সঙ্গে লাগিয়ে<span class=\"en\">Tip of the tongue near the lower front teeth (a small gap)<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ص س ز<\/td><\/tr><tr><td class=\"no\">১৩<\/td><td>জিহ্বার আগা সামনের উপরের দুই দাঁতের আগার সঙ্গে লাগিয়ে<span class=\"en\">Tip of the tongue against the edges of the upper front teeth<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ث ذ ظ<\/td><\/tr><tr><td class=\"no\">১৪<\/td><td>নিচের ঠোঁটের পেট সামনের উপরের দুই দাঁতের আগার সঙ্গে লাগিয়ে<span class=\"en\">Inside of the lower lip against the edges of the upper front teeth<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ف<\/td><\/tr><tr><td class=\"no\">১৫<\/td><td>দুই ঠোঁট থেকে — <span class=\"arx\">ب<\/span> ভেজা অংশ, <span class=\"arx\">م<\/span> শুকনা অংশ, <span class=\"arx\">و<\/span> ঠোঁট গোল করে<span class=\"en\">The two lips — <span class=\"arx\">ب<\/span> wet part, <span class=\"arx\">م<\/span> dry part, <span class=\"arx\">و<\/span> lips rounded<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ب م و<\/td><\/tr><tr><td class=\"no\">১৬<\/td><td>মুখের খালি জায়গা থেকে মদের হরফ (টেনে পড়া হয়)<span class=\"en\">The empty space of mouth & throat — the madd letters<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">ا و ي<\/td><\/tr><tr><td class=\"no\">১৭<\/td><td>নাকের বাঁশি থেকে গুন্নাহ<span class=\"en\">The nasal passage — ghunnah (nasal sound)<\/span><\/td><td class=\"arcell\" style=\"font-size:28pt\">نّ مّ<\/td><\/tr><\/table><div class=\"tip\"><div class=\"ic\">!<\/div><div>মদের হরফ: যবরের পরে খালি আলিফ, পেশের পরে সাকিন ওয়াও, যেরের পরে সাকিন ইয়া।<span class=\"en\">Madd letters: alif after fatḥah, sākin wāw after ḍammah, sākin yāʾ after kasrah.<\/span><\/div><\/div>"}, {"id": "l9", "bn": "কাছাকাছি উচ্চারণের হরফ", "en": "Similar-sounding letters", "no": 6, "part": "প্রথম অংশ: হরফ ও মাখরাজ · Part 1: Letters & Articulation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ০৬<\/b><i>Lesson 06<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">কাছাকাছি উচ্চারণের হরফ<\/div><div class=\"e\">Similar-Sounding Letters<\/div><\/div><div class=\"badge\"><b>দিন ০৬<\/b><i>Day 06<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : কোন হরফগুলো সবসময় মোটা (পুর) করে পড়তে হয়?<\/p><p class=\"a\">উত্তর : <span class=\"arx\">خ ص ض غ ط ق ظ<\/span> — এই ৭টি হরফ সবসময় পুর করে পড়তে হয় (খুস্‌সা দাগতিন ক্বিয্‌)।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: Which letters are always heavy?<\/p><p class=\"a\">A: The 7 letters <span class=\"arx\">خ ص ض غ ط ق ظ<\/span> are always pronounced heavy (tafkhīm).<\/p><\/div><\/div><table class=\"t\"><tr><th>হরফ<small>Letters<\/small><\/th><th>পার্থক্য<small>How they differ<\/small><\/th><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">ت  ط<\/td><td><span class=\"arx\">ت<\/span> হালকা (বারীক), <span class=\"arx\">ط<\/span> ভারী — মুখ ভরে (পুর) পড়তে হয়<span class=\"en\">t is light; ṭ is heavy, with a full mouth<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">ث  س  ص<\/td><td><span class=\"arx\">ث<\/span> জিহ্বা দাঁতের আগায়; <span class=\"arx\">س<\/span> হালকা শিস; <span class=\"arx\">ص<\/span> ভারী শিস<span class=\"en\">th (as in “think”); s light whistle; ṣ heavy whistle<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">ذ  ز  ظ<\/td><td><span class=\"arx\">ذ<\/span> জিহ্বা দাঁতের আগায় হালকা; <span class=\"arx\">ز<\/span> শিস দিয়ে; <span class=\"arx\">ظ<\/span> জিহ্বা দাঁতের আগায় ভারী<span class=\"en\">dh (as in “this”); z buzzing; ẓ heavy dh<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">ء  ع<\/td><td><span class=\"arx\">ء<\/span> হলকের শুরু থেকে হালকা ঝাঁকি; <span class=\"arx\">ع<\/span> হলকের মধ্যখান থেকে চেপে<span class=\"en\">ʾ a light catch deep in the throat; ʿ squeezed from mid-throat<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">ه  ح<\/td><td><span class=\"arx\">ه<\/span> হলকের শুরু থেকে সহজ শ্বাস; <span class=\"arx\">ح<\/span> হলকের মধ্যখান থেকে চাপা শ্বাস<span class=\"en\">h an easy breath; ḥ a tight, breathy sound from mid-throat<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">ك  ق<\/td><td><span class=\"arx\">ك<\/span> জিহ্বার গোড়ার একটু আগে, হালকা; <span class=\"arx\">ق<\/span> জিহ্বার গোড়া থেকে, ভারী<span class=\"en\">k light, further forward; q heavy, from the very back<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">د  ض<\/td><td><span class=\"arx\">د<\/span> জিহ্বার আগা দাঁতের গোড়ায়; <span class=\"arx\">ض<\/span> জিহ্বার কিনারা মাড়ির দাঁতে, ভারী<span class=\"en\">d with the tongue tip; ḍ with the tongue’s side, heavy<\/span><\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:26pt;width:38mm\">ج  ز<\/td><td><span class=\"arx\">ج<\/span> জিহ্বার মধ্যখান থেকে; <span class=\"arx\">ز<\/span> জিহ্বার আগা থেকে শিস দিয়ে<span class=\"en\">j from mid-tongue; z from the tip, buzzing<\/span><\/td><\/tr><\/table><div class=\"card\" style=\"margin-top:3mm;text-align:center\"><div class=\"ar\" style=\"font-size:30pt;color:#C0392B;letter-spacing:6px\">خ ص ض غ ط ق ظ<\/div><div style=\"font-size:9pt\">সবসময় পুর (মোটা) হরফ · Always-heavy letters<\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>ভুল উচ্চারণে অর্থ বদলে যেতে পারে, যেমন <span class=\"arx\">قَلۡب<\/span> (অন্তর) আর <span class=\"arx\">كَلۡب<\/span> (কুকুর)।<span class=\"en\">A wrong sound can change the meaning: qalb (heart) vs kalb (dog).<\/span><\/div><\/div>"}, {"id": "l10", "bn": "নুকতার পরিচয়", "en": "Dots on letters", "no": 7, "part": "প্রথম অংশ: হরফ ও মাখরাজ · Part 1: Letters & Articulation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ০৭<\/b><i>Lesson 07<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">নুকতার পরিচয়<\/div><div class=\"e\">Dots (Nuqṭah)<\/div><\/div><div class=\"badge\"><b>দিন ০৭<\/b><i>Day 07<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : নুকতা কাকে বলে?<\/p><p class=\"a\">উত্তর : হরফের উপরে বা নিচে যে ছোট বিন্দু থাকে, তাকে নুকতা বলে। নুকতাওয়ালা হরফ ১৫টি, নুকতা ছাড়া হরফ ১৪টি।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is a nuqṭah?<\/p><p class=\"a\">A: The small dot(s) above or below a letter. 15 letters have dots; 14 have none.<\/p><\/div><\/div><div class=\"sl\"><b>নুকতা ছাড়া হরফ ১৪টি<\/b><i>14 letters without dots<\/i><\/div><div class=\"grid zebra\" style=\"grid-template-columns:repeat(7,1fr);flex:none;height:52mm;\"><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ا<\/div><div class=\"s1\">আলিফ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ح<\/div><div class=\"s1\">হা<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">د<\/div><div class=\"s1\">দাল<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ر<\/div><div class=\"s1\">রা<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">س<\/div><div class=\"s1\">সীন<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ص<\/div><div class=\"s1\">সোয়াদ<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ط<\/div><div class=\"s1\">তোয়া<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ع<\/div><div class=\"s1\">আইন<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ك<\/div><div class=\"s1\">কাফ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ل<\/div><div class=\"s1\">লাম<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">م<\/div><div class=\"s1\">মীম<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">و<\/div><div class=\"s1\">ওয়াও<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ه<\/div><div class=\"s1\">হা<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ء<\/div><div class=\"s1\">হামযা<\/div><\/div><\/div><div class=\"sl\"><b>নুকতাওয়ালা হরফ ১৫টি<\/b><i>15 letters with dots<\/i><\/div><div class=\"grid zebra\" style=\"grid-template-columns:repeat(8,1fr);flex:none;height:52mm;\"><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ب<\/div><div class=\"s1\">বা<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ت<\/div><div class=\"s1\">তা<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ث<\/div><div class=\"s1\">ছা<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ج<\/div><div class=\"s1\">জীম<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">خ<\/div><div class=\"s1\">খা<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ذ<\/div><div class=\"s1\">যাল<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ز<\/div><div class=\"s1\">যা<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:32pt\">ش<\/div><div class=\"s1\">শীন<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ض<\/div><div class=\"s1\">দোয়াদ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ظ<\/div><div class=\"s1\">যোয়া<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">غ<\/div><div class=\"s1\">গাইন<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ف<\/div><div class=\"s1\">ফা<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ق<\/div><div class=\"s1\">ক্বাফ<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ن<\/div><div class=\"s1\">নূন<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:32pt\">ي<\/div><div class=\"s1\">ইয়া<\/div><\/div><div class=\"cell z\"><svg width=\"51\" viewBox=\"0 0 120 90\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g stroke=\"#5b3a1c\" stroke-width=\"1.2\" stroke-linejoin=\"round\">\n    <path d=\"M20 86 L66 40 L74 ুকতার সংখ্যা ও অবস্থান আলাদা।<span class=\"en\"><span class=\"arx\">ب ت ث<\/span> share one shape; only the dots differ.<\/span><\/div><\/div>"}, {"id": "l11", "bn": "হরফের শুরু, মাঝ ও শেষের রূপ (১)", "en": "Letter positions", "no": 8, "part": "প্রথম অংশ: হরফ ও মাখরাজ · Part 1: Letters & Articulation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ০৮<\/b><i>Lesson 08<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">হরফের শুরু, মাঝ ও শেষের রূপ (১)<\/div><div class=\"e\">Letters at the Beginning, Middle & End (I)<\/div><\/div><div class=\"badge\"><b>দিন ০৮<\/b><i>Day 08<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : শব্দের শুরু, মাঝে ও শেষে হরফ কেমন দেখায়?<\/p><p class=\"a\">উত্তর : আরবি হরফ শব্দে একটির সাথে আরেকটি জুড়ে লেখা হয়। তাই একই হরফ শুরুতে, মাঝে ও শেষে ভিন্ন আকৃতি নেয়। নিচের ঘরে লাল রঙের হরফটি লক্ষ করুন।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: How does a letter look at the start, middle and end?<\/p><p class=\"a\">A: Letters join together, so the same letter takes a different shape at the start, middle and end of a word. Watch the red letter in each example.<\/p><\/div><\/div><table class=\"t pos\"><tr><th style=\"width:21mm\">নাম<small>Name<\/small><\/th><th>আলাদা<small>Alone<\/small><\/th><th>শুরুতে<small>Beginning<\/small><\/th><th>মাঝে<small>Middle<\/small><\/th><th>শেষে<small>End<\/small><\/th><\/tr><tr><td class=\"pn\"><b>আলিফ<\/b><span>Alif<\/span><\/td><td class=\"pc pa\"><div class=\"pf\"><span class=\"arx\">ا<\/span><\ lation", "c": "#0B4A3E", "tint": "#F1F7F4", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ১১<\/b><i>Lesson 11<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">অনুশীলনী — ১<\/div><div class=\"e\">Review — Part 1<\/div><\/div><div class=\"badge\"><b>দিন ১১<\/b><i>Day 11<\/i><\/div><\/div><div style=\"flex:1 1 0;display:flex;flex-direction:column\"><table class=\"ex\" style=\"height:100%\"><tr><td class=\"n\">প্রশ্ন ১<\/td><td>হরফ কাকে বলে? আরবি হরফ কয়টি?<span class=\"en\">What is a ḥarf? How many letters?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ২<\/td><td>এই হরফগুলোর নাম বলো।<span class=\"en\">Name these letters.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">ث ح ذ ص ض ظ ع غ<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৩<\/td><td>মাখরাজ কাকে বলে? মাখরাজ কয়টি?<span class=\"en\">What is a makhraj? How many?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৪<\/td><td>হলকের হরফ কয়টি ও কী কী?<span class=\"en\">Name the throat letters.<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৫<\/td><td>এই হরফগুলো কোন মাখরাজ থেকে উচ্চারিত হয়?<span class=\"en\">Where are these pronounced from?<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">ق ك ج ش ي<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৬<\/td><td>কোন ৭টি হরফ সবসময় পুর করে পড়তে হয়?<span class=\"en\">Which 7 letters are always heavy?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৭<\/td><td>পার্থক্য করে উচ্চারণ করো।<span class=\"en\">Pronounce and show the difference.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">ت ط · س ص · ذ ز ظ<\/span><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৮<\/td><td>নুকতা কাকে বলে? নুকতাওয়ালা হরফ কয়টি?<span class=\"en\">What is a nuqṭah? How many letters have dots?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ৯<\/td><td>কোন হরফগুলো পরের হরফের সাথে যুক্ত হয় না?<span class=\"en\">Which letters do not join to the next?<\/span><\/td><td class=\"w\"><div class=lines><\/div><\/td><\/tr><tr><td class=\"n\">প্রশ্ন ১০<\/td><td>এগুলোর আলাদা রূপ লেখো।<span class=\"en\">Write the isolated forms.<\/span><\/td><td class=\"w\"><div class=ar style='font-size:19pt;text-align:center;color:#123A63'><span class=\"arx\">ـبـ ـعـ هـ ـق<\/span><\/div><\/td><\/tr><\/table><\/div><div class=\"tip\"><div class=\"ic\">✓<\/div><div>শিক্ষক মৌখিকভাবে প্রশ্ন করবেন; শিক্ষার্থী ডান পাশের ঘরে লিখবে বা পড়ে শোনাবে।<span class=\"en\">The teacher asks orally; the learner answers or writes in the right-hand box.<\/span><\/div><\/div>"}, {"id": "l15", "bn": "হরকতের পরিচয়", "en": "The short vowels", "no": 12, "part": "দ্বিতীয় অংশ: হরকত · Part 2: Short Vowels", "c": "#1F4E8C", "tint": "#EEF3FA", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ১২<\/b><i>Lesson 12<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9 in · jun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">حًا حٍ حٌ<\/div><div class=\"s2\">ḥan · ḥin · ḥun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">خًا خٍ خٌ<\/div><div class=\"s2\">khan · khin · khun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">دًا دٍ دٌ<\/div><div class=\"s2\">dan · din · dun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">ذًا ذٍ ذٌ<\/div><div class=\"s2\">dhan · dhin · dhun<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">رًا رٍ رٌ<\/div><div class=\"s2\">ran · rin · run<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">زًا زٍ زٌ<\/div><div class=\"s2\">zan · zin · zun<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">سًا سٍ سٌ<\/div><div class=\"s2\">san · sin · sun<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">شًا شٍ شٌ<\/div><div class=\"s2\">shan · shin · shun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">صًا صٍ صٌ<\/div><div class=\"s2\">ṣan · ṣin · ṣun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">ضًا ضٍ ضٌ<\/div><div class=\"s2\">ḍan · ḍin · ḍun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">طًا طٍ طٌ<\/div><div class=\"s2\">ṭan · ṭin · ṭun<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:24pt\">ظًا ظٍ ظٌ<\/div><div class=\"s2\">ẓan · ẓin · ẓun<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">عًا عٍ عٌ<\/div><div class=\"s2\">ʿan · ʿin · ʿun<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">غًا غٍ غٌ<\/div><div class=\"s2\">ghan · ghin · ghun<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">فًا فٍ فٌ<\/div><div class=\"s2\">fan · fin · fun<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:24pt\">قًا قٍ قٌ<\/d ًا<\/span>) পড়া হয় না; তবে ওয়াকফ (থামা) করলে এক আলিফ টেনে “বা” পড়া হয়।<span class=\"en\">The alif after a double fatḥah (<span class=\"arx\">بًا<\/span>) is silent; when stopping on it, read a 2-count “bā”.<\/span><\/div><\/div>"}, {"id": "l25", "bn": "তানবীনের মাশক", "en": "Tanwīn words", "no": 22, "part": "তৃতীয় অংশ: তানবীন, সাকিন, লীন ও কলকলা · Part 3: Tanwīn, Sukūn, Līn & Qalqalah", "c": "#8C2A3C", "tint": "#FBF1F3", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ২২<\/b><i>Lesson 22<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">তানবীনের মাশক<\/div><div class=\"e\">Tanwīn Words — with meanings<\/div><\/div><div class=\"badge\"><b>দিন ২২<\/b><i>Day 22<\/i><\/div><\/div><div class=\"grid zebra\" style=\"grid-template-columns:repeat(3,1fr);\"><div class=\"cell\"><div class=\"g\" style=\"font-size:30pt\">وَلَدٌ<\/div><div class=\"s1\">সন্তান<\/div><div class=\"s2\">child<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:30pt\">قَلَمٌ<\/div><div class=\"s1\">কলম<\/div><div class=\"s2\">pen<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:30pt\">بَلَدٌ<\/div><div class=\"s1\">শহর<\/div><div class=\"s2\">town<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:30pt\">جَبَلٌ<\/div><div class=\"s1\">পাহাড়<\/div><div class=\"s2\">mountain<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:30pt\">عَمَلٌ<\/div><div class=\"s1\">কাজ<\/div><div class=\"s2\">deed<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:30pt\">رَج >প্রশ্ন : তাশদীদ কাকে বলে?<\/p><p class=\"a\">উত্তর : হরফের উপরের ( <span class=\"arx\">ّ<\/span> ) চিহ্নকে তাশদীদ বলে। তাশদীদওয়ালা হরফ দুইবার পড়া হয় — প্রথমবার আগের হরফের সাথে সাকিন হয়ে, দ্বিতীয়বার নিজের হরকতসহ।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is a shaddah?<\/p><p class=\"a\">A: The mark ( <span class=\"arx\">ّ<\/span> ) doubles a letter: first as a sukūn joined to the previous letter, then with its own vowel — <span class=\"arx\">أَبَّ<\/span> = ab-ba.<\/p><\/div><\/div><div class=\"grid zebra\" style=\"grid-template-columns:repeat(4,1fr);\"><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَبَّ<\/div><div class=\"s2\">ab-ba<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَتَّ<\/div><div class=\"s2\">at-ta<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَثَّ<\/div><div class=\"s2\">ath-tha<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَجَّ<\/div><div class=\"s2\">aj-ja<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:28pt\">أَحَّ<\/div><div class=\"s2\">aḥ-ḥa<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:28pt\">أَخَّ<\/div><div class=\"s2\">akh-kha<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:28pt\">أَدَّ<\/div><div class=\"s2\">ad-da<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:28pt\">أَذَّ<\/div><div class=\"s2\">adh-dha<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَرَّ<\/div><div class=\"s2\">ar-ra<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَزَّ<\/div><div class=\"s2\">az-za<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَسَّ<\/div><div class=\"s2\">as-sa<\/div><\/div><div class=\"cell\"><div class=\"g\" style=\"font-size:28pt\">أَشَّ<\/div><div class=\"s2\">ash-sha<\/div><\/div><div class=\"cell z\"><div class=\"g\" style=\"font-size:28pt\">أَصَّ<\/div>  হলে প্রায় এক আলিফ পরিমাণ গুন্নাহ করে পড়তে হয়।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is ghunnah?<\/p><p class=\"a\">A: A nasal sound from the nose. With a doubled nūn ( <span class=\"arx\">نّ<\/span> ) or mīm ( <span class=\"arx\">مّ<\/span> ) hold the ghunnah for about 1 alif.<\/p><\/div><\/div><div class=\"two\" style=\"margin-bottom:3mm\"><div class=\"card\" style=\"text-align:center\"><div class=\"ar\" style=\"font-size:40pt;color:#C0392B\">نّ<\/div><b>নূন মুশাদ্দাদ<\/b><div class=\"s2\" style=\"font-family:Montserrat;font-size:7.6pt;color:#9A7B1C\">Nūn with shaddah<\/div><\/div><div class=\"card\" style=\"text-align:center\"><div class=\"ar\" style=\"font-size:40pt;color:#C0392B\">مّ<\/div><b>মীম মুশাদ্দাদ<\/b><div style=\"font-family:Montserrat;font-size:7.6pt;color:#9A7B1C\">Mīm with shaddah<\/div><\/div><\/div><div class=\"sl\"><b>কুরআন থেকে উদাহরণ<\/b><i>Examples from the Quran<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(3,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">إِنَّ<\/span><\/div><div class=\"r\">১০৩:২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">ثُمَّ<\/span><\/div><div class=\"r\">১০২:৪<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">عَمَّ<\/span><\/div><div class=\"r\">৭৮:১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">مِمَّ<\/span><\/div><div class=\"r\">৮৬:৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">ٱل<span class=\"hl\">نَّ<\/span>اسِ<\/div><div class=\"r\">১১৪:১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">ٱلۡ<span class=\"hl\">جَنَّ<\/span>ةَ<\/div><div class=\"r\">২:৩৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">أُمَّ<\/span>ةࣰ<\/div><div class=\"r\">২:১২৮<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">هَمَّ<\/span>تۡ<\/div><div class=\"r\">১২:২৪<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">ٱلۡ<span class=\"hl\">جِنَّ<\/span>ةِ<\/div><div class=\"r\">১১৪:৬<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>নাক চেপে ধরে পড়লে গুন্নাহর আওয়াজ বন্ধ হয়ে যায় — এভাবে পরীক্ষা করে দেখুন।<span class=\"en\">Pinch your nose: if the sound stops, you are producing ghunnah.<\/span><\/div><\/div>"}, {"id": "l35", "bn": "মদের হরফের পরিচয়", "en": "Madd letters", "no": 32, "part": "চতুর্থ অংশ: তাশদীদ, গুন্নাহ ও মদ · Part 4: Shaddah, Ghunnah & Madd", "c": "#5B3A8C", "tint": "#F4F0FA", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৩২<\/b><i>Lesson 32<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">মদের হরফের পরিচয়<\/div><div class=\"e\">The Madd Letters — Long Vowels<\/div><\/div><div class=\"badge\"><b>দিন ৩২<\/b><i>Day 32<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : মদ কাকে বলে? মদের হরফ কয়টি?<\/p><p class=\"a\">উত্তর : মদ অর্থ টেনে পড়া। মদের হরফ ৩টি — <span class=\"arx\">ا و ي<\/span>। যবরের পরে খালি আলিফ, যেরের পরে সাকিন ইয়া, পেশের পরে সাকিন ওয়াও থাকলে এক আলিফ টেনে পড়তে হয়।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: What is madd?<\/p><p class=\"a\">A: Madd means lengthening. Alif after fatḥah, yāʾ after kasrah, wāw after ḍammah are stretched 1 alif: bā, bī, bū.<\/p><\/div><\/div><div class=\"grid zebra\" style=\"grid-template-columns:repeat(4,1fr);\"><div class=\"cell\"><div class=\"g\ =\"g\" style=\"font-size:30pt\">صِرَاطٌ<\/div><div class=\"s1\">পথ<\/div><div class=\"s2\">path<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>মদের হরফ ঠিক এক আলিফ টানুন — কম বা বেশি নয়।<span class=\"en\">Stretch the madd exactly 1 alif — no more, no less.<\/span><\/div><\/div>"}, {"id": "l37", "bn": "খাড়া যবর, খাড়া যের ও উল্টা পেশ", "en": "Standing vowels", "no": 34, "part": "চতুর্থ অংশ: তাশদীদ, গুন্নাহ ও মদ · Part 4: Shaddah, Ghunnah & Madd", "c": "#5B3A8C", "tint": "#F4F0FA", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৩৪<\/b><i>Lesson 34<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">খাড়া যবর, খাড়া যের ও উল্টা পেশ<\/div><div class=\"e\">Standing Fatḥah, Kasrah & Inverted Ḍammah<\/div><\/div><div class=\"badge\"><b>দিন ৩৪<\/b><i>Day 34<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : খাড়া যবর, খাড়া যের ও উল্টা পেশ কীভাবে পড়বো?<\/p><p class=\"a\">উত্তর : এগুলো মদের হরফের কাজ করে — তাই এক আলিফ পরিমাণ টেনে পড়তে হয়।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: How are these read?<\/p><p class=\"a\">A: They act like madd letters, so each is stretched 1 alif.<\/p><\/div><\/div><table class=\"t\"><tr><th>চিহ্ন<\/th><th>নাম<small>Name<\/small><\/th><th>নিয়ম<small>Rule<\/small><\/th><th>মাদানী ছাপায়<small>Madani Muṣḥaf<\/small><\/th><\/tr><tr><td class=\"arcell\" style=\"font-size:30pt\">بٰ<\/td><td>খাড়া যবর<span class=\"en\">Standing fatḥah<\/span><\/td><td>এক আলিফ টেনে<span class=\"en\">lengthen 1 alif<\/span><\/td><td style=\"text-align:center\">—<\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:30pt\">بٖ<\/td><td>খাড়া যের<span class=\"en\">Standing kasrah<\/span><\/td><td>এক আলিফ টেনে<span class=\"en\">lengthen 1 alif<\/span><\/td><td style=\"text-align:center\"><span class=\"arx\">ۦ<\/span> (ছোট ইয়া)<\/td><\/tr><tr><td class=\"arcell\" style=\"font-size:30pt\">بٗ<\/td><td>উল্টা পেশ<span class=\"en\">Inverted ḍammah<\/span><\/td><td>এক আলিফ টেনে<span class=\"en\">lengthen 1 alif<\/span><\/td><td style=\"text-align:center\"><span class=\"arx\">ۥ<\/span> (ছোট ওয়াও)<\/td><\/tr><\/table><div class=\"sl\"><b>কুরআন থেকে উদাহরণ<\/b><i>Examples from the Quran<\/i><\/div><div class=\"exm\" style=\"flex:1 1 0;grid-auto-rows:1fr;grid-template-columns:repeat(3,1fr)\"><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">ٱلرَّحۡ<span class=\"hl\">مَٰ<\/span>نِ<\/div><div class=\"r\">১:১<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">ذَٰ<\/span>لِكَ<\/div><div class=\"r\">২:২<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">إِلَٰ<\/span>هَ<\/div><div class=\"r\">২:২৫৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">هَٰ<\/span>ذَا<\/div><div class=\"r\">২:২৫<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">لَّ<span class=\"hl\">هُۥ<\/span><\/div><div class=\"r\">১১২:৪<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\"><span class=\"hl\">بِهِۦ<\/span><\/div><div class=\"r\">২:২৬<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">رَبَّ<span class=\"hl\">هُۥ<\/span><\/div><div class=\"r\">৯৮:৮<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">أَخۡلَدَ<span class=\"hl\">هُۥ<\/span><\/div><div class=\"r\">১০৪:৩<\/div><\/div><div class=\"e\"><div class=\"g\" style=\"font-size:30pt\">ٱلسَّمَٰ<span class=\"hl\">وَٰ<\/span>تِ<\/div><div class=\"r\">২:৩৩<\/div><\/div><\/div><div class=\"tip\"><div class=\"ic\">!<\/div><div>হা যমীর (<span class=\"arx\">ـهُ<\/span> / <span class=\"arx\">ـهِ<\/span>)-এর আগের হরফে হরকত থাকলে মাদানী ছাপায় ছোট ওয়াও/ইয়া বসে — এক আলিফ টেনে পড়ুন।<span class=\"en\">In the Madani Muṣḥaf the pronoun “hu/hi” after a voweled letter carries a small wāw/yāʾ: read it 1 alif.<\/span><\/div><\/div>"}, {"id": "l38", "bn": "কোন মদ কত আলিফ?", "en": "Madd lengths in alifs", "no": 35, "part": "চতুর্থ অংশ: তাশদীদ, গুন্নাহ ও মদ · Part 4: Shaddah, Ghunnah & Madd", "c": "#5B3A8C", "tint": "#F4F0FA", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৩৫<\/b><i>Lesson 35<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">কোন মদ কত আলিফ?<\/div><div class=\"e\">How Long Is Each Madd? — Counting in Alifs<\/div><\/div><div class=\"badge\"><b>দিন ৩৫<\/b><i>Day 35<\/i><\/div><\/div><div class=\"qa\"><div class=\"bnq\"><p class=\"q\">প্রশ্ন : আলিফ গুনে মদ টানবো কীভাবে?<\/p><p class=\"a\">উত্তর : এক আলিফ মানে একটি আঙুল স্বাভাবিকভাবে ভাঁজ করার সময়। দুই আলিফ টানতে দুটি আঙুল, তিন আলিফে তিনটি, চার আলিফে চারটি আঙুল গুনে টানুন।<\/p><\/div><div class=\"enq\"><p class=\"q\">Q: How do I count the length?<\/p><p class=\"a\">A: One alif = the time to fold one finger at a normal pace. Count 2, 3 or 4 fingers for 2, 3 or 4 alifs.<\/p><\/div><\/div><table class=\"t mo\"><tr><th>মদের নাম<small>Name<\/small><\/th><th>কখন হয়<small>When<\/small><\/th><th>উদাহরণ<small>Example<\/small><\/th><th style=\"width:44mm\">টান<small>Length<\/small><\/th><\/tr><tr><td style=\"border-left:2mm solid #2E7D5B\"><b style=\"font-size:12pt;color:#2E7
