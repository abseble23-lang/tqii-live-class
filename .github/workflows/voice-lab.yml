name: voice lab
on:
  push:
    branches: [voice-lab]
    paths: ["voicelab/**", ".github/workflows/voice-lab.yml"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for m in EMTIAZZ/bangladeshi-bangla-tts-vits bangla-speech-processing/bangla_tts_male bangla-speech-processing/bangla_tts_female hexgrad/Kokoro-82M; do
            echo "=== $m"; curl -s "https://huggingface.co/api/models/$m" | python3 -c "import json,sys;d=json.load(sys.stdin);print('license:',d.get('cardData',{}).get('license'),'| gated:',d.get('gated'));print([s['rfilename'] for s in d.get('siblings',[])][:40])"
          done
          echo "=== Banglabox org"; curl -s "https://huggingface.co/api/models?author=Banglabox" | python3 -c "import json,sys;[print(x['id']) for x in json.load(sys.stdin)]"
          curl -s "https://huggingface.co/api/datasets?author=Banglabox" | python3 -c "import json,sys;[print('ds',x['id']) for x in json.load(sys.stdin)]"
          for m in $(curl -s "https://huggingface.co/api/models?author=Banglabox" | python3 -c "import json,sys;[print(x['id']) for x in json.load(sys.stdin)]"); do echo "=== $m"; curl -s "https://huggingface.co/api/models/$m" | python3 -c "import json,sys;d=json.load(sys.stdin);print('license:',d.get('cardData',{}).get('license'),'| gated:',d.get('gated'));print([s['rfilename'] for s in d.get('siblings',[])][:60])"; curl -s "https://huggingface.co/$m/raw/main/README.md" | head -c 3000; echo; done
          echo "=== EMTIAZZ readme"; curl -s https://huggingface.co/EMTIAZZ/bangladeshi-bangla-tts-vits/raw/main/README.md | head -c 2500
