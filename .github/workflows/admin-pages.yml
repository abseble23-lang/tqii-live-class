name: Deploy admin panel

on:
  push:
    branches: [main]
    paths: ["admin/**", "web-qaida/**", "tools/qaida-voice/sentences.json", ".github/workflows/admin-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site (admin panel + Qaida web app at /qaida/)
        run: |
          mkdir -p site
          cp -r admin/. site/
          mkdir -p site/qaida
          cp -r web-qaida/. site/qaida/
          cp tools/qaida-voice/sentences.json site/qaida-record/sentences.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
