تَعِينُ <span class=\"an\">﴿٥﴾<\/span> ٱهۡدِنَا ٱلصِّرَٰطَ ٱلۡمُسۡتَقِيمَ <span class=\"an\">﴿٦﴾<\/span> صِرَٰطَ ٱلَّذِينَ أَنۡعَمۡتَ عَلَيۡهِمۡ غَيۡرِ ٱلۡمَغۡضُوبِ عَلَيۡهِمۡ وَلَا ٱلضَّآلِّينَ <span class=\"an\">﴿٧﴾<\/span> <\/div><table class=\"t st\"><tr><th>আয়াত<\/th><th>বাংলা অর্থ<small>Muhiuddin Khan<\/small><\/th><th>English meaning<small>Saheeh International<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>শুরু করছি আল্লাহর নামে যিনি পরম করুণাময়, অতি দয়ালু।<\/td><td class=\"ent\">In the name of Allah, the Entirely Merciful, the Especially Merciful<\/td><\/tr><tr><td class=\"no\">২<\/td><td>যাবতীয় প্রশংসা আল্লাহ তাআলার যিনি সকল সৃষ্টি জগতের পালনকর্তা।<\/td><td class=\"ent\">[All] praise is [due] to Allah, Lord of the worlds<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>যিনি নিতান্ত মেহেরবান ও দয়ালু।<\/td><td class=\"ent\">The Entirely Merciful, the Especially Merciful<\/td><\/tr><tr><td class=\"no\">৪<\/td><td>যিনি বিচার দিনের মালিক।<\/td><td class=\"ent\">Sovereign of the Day of Recompense<\/td><\/tr><tr><td class=\"no\">৫<\/td><td>আমরা একমাত্র তোমারই ইবাদত করি এবং শুধুমাত্র তোমারই সাহায্য প্রার্থনা করি।<\/td><td class=\"ent\">It is You we worship and You we ask for help<\/td><\/tr><tr><td class=\"no\">৬<\/td><td>আমাদেরকে সরল পথ দেখাও<\/td><td class=\"ent\">Guide us to the straight path<\/td><\/tr><tr><td class=\"no\">৭<\/td><td>সে সমস্ত লোকের পথ, যাদেরকে তুমি নেয়ামত দান করেছ। তাদের পথ নয়, যাদের প্রতি তোমার গজব নাযিল হয়েছে এবং যারা পথভ্রষ্ট হয়েছে।<\/td><td class=\"ent\">The path of those upon whom You have bestowed favor, not of those who have evoked [Your] anger or of those who are astray<\/td><\/tr><\/table><\/div><div style=\"flex:1\"><\/div><div class=\"tip\"><div class=\"ic\">✓<\/div><div>প্রথমে শিক্ষকের তিলাওয়াত শুনুন, তারপর আয়াত আয়াত করে পড়ুন। লক্ষ রাখুন: মদ, গুন্নাহ ও কলকলা।<span class=\"en\">Listen to your teacher first, then read āyah by āyah — watch for madd, ghunnah and qalqalah.<\/span><\/div><\/div>"}, {"id": "l57", "bn": "সূরা আল-ইখলাস ও সূরা আল-কাওসার", "en": "Al-Ikhlāṣ, Al-Kawthar", "no": 54, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫৪<\/b><i>Lesson 54<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">সূরা আল-ইখলাস ও সূরা আল-কাওসার<\/div><div class=\"e\">Sūrat Al-Ikhlāṣ · Sūrat Al-Kawthar<\/div><\/div><div class=\"badge\"><b>দিন ৫৪<\/b><i>Day 54<\/i><\/div><\/div><div class=\"sbox\"><div class=\"sh\"><b>সূরা আল-ইখলাস<\/b><span>Al-Ikhlāṣ · ১১২ · আয়াত ৪<\/span><\/div><div class=\"ar\" style=\"text-align:center;font-size:22pt;color:#7A5A12;line-height:1.6\">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<\/div><div class=\"ar sar\" style=\"font-size:26pt\">قُلۡ هُوَ ٱللَّهُ أَحَدٌ <span class=\"an\">﴿١﴾<\/span> ٱللَّهُ ٱلصَّمَدُ <span class=\"an\">﴿٢﴾<\/span> لَمۡ يَلِدۡ وَلَمۡ يُولَدۡ <span class=\"an\">﴿٣﴾<\/span> وَلَمۡ يَكُن لَّهُۥ كُفُوًا أَحَدُۢ <span class=\"an\">﴿٤﴾<\/span> <\/div><table class=\"t st\"><tr><th>আয়াত<\/th><th>বাংলা অর্থ<small>Muhiuddin Khan<\/small><\/th><th>English meaning<small>Saheeh International<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>বলুন, তিনি আল্লাহ, এক<\/td><td class=\"ent\">Say, \"He is Allah, [who is] One<\/td><\/tr><tr><td class=\"no\">২<\/td><td>আল্লাহ অমুখাপেক্ষী<\/td><td class=\"ent\">Allah, the Eternal Refuge<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>তিনি কাউকে জন্ম দেননি এবং কেউ তাকে জন্ম দেয়নি<\/td><td class=\"ent\">He neither begets nor is born<\/td><\/tr><tr><td class=\"no\">৪<\/td><td>এবং তার সমতুল্য কেউ নেই।<\/td><td class=\"ent\">Nor is there to Him any equivalent<\/td><\/tr><\/table><\/div><div class=\"sbox\"><div class=\"sh\"><b>সূরা আল-কাওসার<\/b><span>Al-Kawthar · ১০৮ · আয়াত ৩<\/span><\/div><div class=\"ar\" style=\"text-align:center;font-size:22pt;color:#7A5A12;line-height:1.6\">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<\/div><div class=\"ar sar\" style=\"font-size:26pt\">إِنَّآ أَعۡطَيۡنَٰكَ ٱلۡكَوۡثَرَ <span class=\"an\">﴿١﴾<\/span> فَصَلِّ لِرَبِّكَ وَٱنۡحَرۡ <span class=\"an\">﴿٢﴾<\/span> إِنَّ شَانِئَكَ هُوَ ٱلۡأَبۡتَرُ <span class=\"an\">﴿٣﴾<\/span> <\/div><table class=\"t st\"><tr><th>আয়াত<\/th><th>বাংলা অর্থ<small>Muhiuddin Khan<\/small><\/th><th>English meaning<small>Saheeh International<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>নিশ্চয় আমি আপনাকে কাওসার দান করেছি।<\/td><td class=\"ent\">Indeed, We have granted you, [O Muhammad], al-Kawthar<\/td><\/tr><tr><td class=\"no\">২<\/td><td>অতএব আপনার পালনকর্তার উদ্দেশ্যে নামায পড়ুন এবং কোরবানী করুন।<\/td><td class=\"ent\">So pray to your Lord and sacrifice [to Him alone]<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>যে আপনার শত্রু, সেই তো লেজকাটা, নির্বংশ।<\/td><td class=\"ent\">Indeed, your enemy is the one cut off<\/td><\/tr><\/table><\/div><div style=\"flex:1\"><\/div><div class=\"tip\"><div class=\"ic\">✓<\/div><div>প্রথমে শিক্ষকের তিলাওয়াত শুনুন, তারপর আয়াত আয়াত করে পড়ুন। লক্ষ রাখুন: মদ, গুন্নাহ ও কলকলা।<span class=\"en\">Listen to your teacher first, then read āyah by āyah — watch for madd, ghunnah and qalqalah.<\/span><\/div><\/div>"}, {"id": "l58", "bn": "সূরা আল-ফালাক ও সূরা আন-নাস", "en": "Al-Falaq, An-Nās", "no": 55, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫৫<\/b><i>Lesson 55<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">সূরা আল-ফালাক ও সূরা আন-নাস<\/div><div class=\"e\">Sūrat Al-Falaq · Sūrat An-Nās<\/div><\/div><div class=\"badge\"><b>দিন ৫৫<\/b><i>Day 55<\/i><\/div><\/div><div class=\"sbox\"><div class=\"sh\"><b>সূরা আল-ফালাক<\/b><span>Al-Falaq · ১১৩ · আয়াত ৫<\/span><\/div><div class=\"ar\" style=\"text-align:center;font-size:18pt;color:#7A5A12;line-height:1.6\">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<\/div><div class=\"ar sar\" style=\"font-size:22pt\">قُلۡ أَعُوذُ بِرَبِّ ٱلۡفَلَقِ <span class=\"an\">﴿١﴾<\/span> مِن شَرِّ مَا خَلَقَ <span class=\"an\">﴿٢﴾<\/span> وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ <span class=\"an\">﴿٣﴾<\/span> وَمِن شَرِّ ٱلنَّفَّـٰثَٰتِ فِي ٱلۡعُقَدِ <span class=\"an\">﴿٤﴾<\/span> وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ <span class=\"an\">﴿٥﴾<\/span> <\/div><table class=\"t st\"><tr><th>আয়াত<\/th><th>বাংলা অর্থ<small>Muhiuddin Khan<\/small><\/th><th>English meaning<small>Saheeh International<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>বলুন, আমি আশ্রয় গ্রহণ করছি প্রভাতের পালনকর্তার<\/td><td class=\"ent\">Say, \"I seek refuge in the Lord of daybreak<\/td><\/tr><tr><td class=\"no\">২<\/td><td>তিনি যা সৃষ্টি করেছেন, তার অনিষ্ট থেকে<\/td><td class=\"ent\">From the evil of that which He created<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>অন্ধকার রাত্রির অনিষ্ট থেকে, যখন তা সমাগত হয়<\/td><td class=\"ent\">And from the evil of darkness when it settles<\/td><\/tr><tr><td class=\"no\">৪<\/td><td>গ্রন্থিতে ফুঁৎকার দিয়ে জাদুকারিনীদের অনিষ্ট থেকে<\/td><td class=\"ent\">And from the evil of the blowers in knots<\/td><\/tr><tr><td class=\"no\">৫<\/td><td>এবং হিংসুকের অনিষ্ট থেকে যখন সে হিংসা করে।<\/td><td class=\"ent\">And from the evil of an envier when he envies<\/td><\/tr><\/table><\/div><div class=\"sbox\"><div class=\"sh\"><b>সূরা আন-নাস<\/b><span>An-Nās · ১১৪ · আয়াত ৬<\/span><\/div><div class=\"ar\" style=\"text-align:center;font-size:18pt;color:#7A5A12;line-height:1.6\">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<\/div><div class=\"ar sar\" style=\"font-size:22pt\">قُلۡ أَعُوذُ بِرَبِّ ٱلنَّاسِ <span class=\"an\">﴿١﴾<\/span> مَلِكِ ٱلنَّاسِ <span class=\"an\">﴿٢﴾<\/span> إِلَٰهِ ٱلنَّاسِ <span class=\"an\">﴿٣﴾<\/span> مِن شَرِّ ٱلۡوَسۡوَاسِ ٱلۡخَنَّاسِ <span class=\"an\">﴿٤﴾<\/span> ٱلَّذِي يُوَسۡوِسُ فِي صُدُورِ ٱلنَّاسِ <span class=\"an\">﴿٥﴾<\/span> مِنَ ٱلۡجِنَّةِ وَٱلنَّاسِ <span class=\"an\">﴿٦﴾<\/span> <\/div><table class=\"t st\"><tr><th>আয়াত<\/th><th>বাংলা অর্থ<small>Muhiuddin Khan<\/small><\/th><th>English meaning<small>Saheeh International<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>বলুন, আমি আশ্রয় গ্রহণ করিতেছি মানুষের পালনকর্তার<\/td><td class=\"ent\">Say, \"I seek refuge in the Lord of mankind<\/td><\/tr><tr><td class=\"no\">২<\/td><td>মানুষের অধিপতির<\/td><td class=\"ent\">The Sovereign of mankind<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>মানুষের মা’বুদের<\/td><td class=\"ent\">The God of mankind<\/td><\/tr><tr><td class=\"no\">৪<\/td><td>তার অনিষ্ট থেকে, যে কুমন্ত্রণা দেয় ও আত্নগোপন করে<\/td><td class=\"ent\">From the evil of the retreating whisperer<\/td><\/tr><tr><td class=\"no\">৫<\/td><td>যে কুমন্ত্রণা দেয় মানুষের অন্তরে<\/td><td class=\"ent\">Who whispers [evil] into the breasts of mankind<\/td><\/tr><tr><td class=\"no\">৬<\/td><td>জ্বিনের মধ্য থেকে অথবা মানুষের মধ্য থেকে।<\/td><td class=\"ent\">From among the jinn and mankind<\/td><\/tr><\/table><\/div><div style=\"flex:1\"><\/div>"}, {"id": "l59", "bn": "সূরা আল-আসর ও সূরা আন-নাসর", "en": "Al-ʿAṣr, An-Naṣr", "no": 56, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫৬<\/b><i>Lesson 56<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">সূরা আল-আসর ও সূরা আন-নাসর<\/div><div class=\"e\">Sūrat Al-ʿAṣr · Sūrat An-Naṣr<\/div><\/div><div class=\"badge\"><b>দিন ৫৬<\/b><i>Day 56<\/i><\/div><\/div><div class=\"sbox\"><div class=\"sh\"><b>সূরা আল-আসর<\/b><span>Al-ʿAṣr · ১০৩ · আয়াত ৩<\/span><\/div><div class=\"ar\" style=\"text-align:center;font-size:22pt;color:#7A5A12;line-height:1.6\">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<\/div><div class=\"ar sar\" style=\"font-size:26pt\">وَٱلۡعَصۡرِ <span class=\"an\">﴿١﴾<\/span> إِنَّ ٱلۡإِنسَٰنَ لَفِي خُسۡرٍ <span class=\"an\">﴿٢﴾<\/span> إِلَّا ٱلَّذِينَ ءَامَنُواْ وَعَمِلُواْ ٱلصَّـٰلِحَٰتِ وَتَوَاصَوۡاْ بِٱلۡحَقِّ وَتَوَاصَوۡاْ بِٱلصَّبۡرِ <span class=\"an\">﴿٣﴾<\/span> <\/div><table class=\"t st\"><tr><th>আয়াত<\/th><th>বাংলা অর্থ<small>Muhiuddin Khan<\/small><\/th><th>English meaning<small>Saheeh International<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>কসম যুগের (সময়ের)<\/td><td class=\"ent\">By time<\/td><\/tr><tr><td class=\"no\">২<\/td><td>নিশ্চয় মানুষ ক্ষতিগ্রস্ত<\/td><td class=\"ent\">Indeed, mankind is in loss<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>কিন্তু তারা নয়, যারা বিশ্বাস স্থাপন করে ও সৎকর্ম করে এবং পরস্পরকে তাকীদ করে সত্যের এবং তাকীদ করে সবরের।<\/td><td class=\"ent\">Except for those who have believed and done righteous deeds and advised each other to truth and advised each other to patience<\/td><\/tr><\/table><\/div><div class=\"sbox\"><div class=\"sh\"><b>সূরা আন-নাসর<\/b><span>An-Naṣr · ১১০ · আয়াত ৩<\/span><\/div><div class=\"ar\" style=\"text-align:center;font-size:22pt;color:#7A5A12;line-height:1.6\">بِسۡمِ ٱللَّهِ ٱلرَّحۡمَٰنِ ٱلرَّحِيمِ<\/div><div class=\"ar sar\" style=\"font-size:26pt\">إِذَا جَآءَ نَصۡرُ ٱللَّهِ وَٱلۡفَتۡحُ <span class=\"an\">﴿١﴾<\/span> وَرَأَيۡتَ ٱلنَّاسَ يَدۡخُلُونَ فِي دِينِ ٱللَّهِ أَفۡوَاجࣰا <span class=\"an\">﴿٢﴾<\/span> فَسَبِّحۡ بِحَمۡدِ رَبِّكَ وَٱسۡتَغۡفِرۡهُۚ إِنَّهُۥ كَانَ تَوَّابَۢا <span class=\"an\">﴿٣﴾<\/span> <\/div><table class=\"t st\"><tr><th>আয়াত<\/th><th>বাংলা অর্থ<small>Muhiuddin Khan<\/small><\/th><th>English meaning<small>Saheeh International<\/small><\/th><\/tr><tr><td class=\"no\">১<\/td><td>যখন আসবে আল্লাহর সাহায্য ও বিজয়<\/td><td class=\"ent\">When the victory of Allah has come and the conquest<\/td><\/tr><tr><td class=\"no\">২<\/td><td>এবং আপনি মানুষকে দলে দলে আল্লাহর দ্বীনে প্রবেশ করতে দেখবেন<\/td><td class=\"ent\">And you see the people entering into the religion of Allah in multitudes<\/td><\/tr><tr><td class=\"no\">৩<\/td><td>তখন আপনি আপনার পালনকর্তার পবিত্রতা বর্ণনা করুন এবং তাঁর কাছে ক্ষমা প্রার্থনা করুন। নিশ্চয় তিনি ক্ষমাকারী।<\/td><td class=\"ent\">Then exalt [Him] with praise of your Lord and ask forgiveness of Him. Indeed, He is ever Accepting of repentance<\/td><\/tr><\/table><\/div><div style=\"flex:1\"><\/div><div class=\"tip\"><div class=\"ic\">✓<\/div><div>প্রথমে শিক্ষকের তিলাওয়াত শুনুন, তারপর আয়াত আয়াত করে পড়ুন। লক্ষ রাখুন: মদ, গুন্নাহ ও কলকলা।<span class=\"en\">Listen to your teacher first, then read āyah by āyah — watch for madd, ghunnah and qalqalah.<\/span><\/div><\/div>"}, {"id": "l60", "bn": "কালিমা ও ইসলামের স্তম্ভ", "en": "Kalimah & pillars", "no": 57, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫৭<\/b><i>Lesson 57<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">কালিমা<\/div><div class=\"e\">The Kalimah<\/div><\/div><div class=\"badge\"><b>দিন ৫৭<\/b><i>Day 57<\/i><\/div><\/div><div class=\"card\" style=\"margin-bottom:5mm;text-align:center;padding:5mm 4mm\"><h4>কালিমা তাইয়্যিবা<small>Kalimah Ṭayyibah<\/small><\/h4>\n        <div class=\"ar\" style=\"font-size:31pt;color:#123A63;line-height:1.9;margin:3mm 0\">لَا إِلَٰهَ إِلَّا اللَّهُ مُحَمَّدٌ رَسُولُ اللَّهِ<\/div><p style=\"margin:1mm 0 0;font-size:10pt\">আল্লাহ ছাড়া কোনো ইলাহ (সত্য উপাস্য) নেই, মুহাম্মাদ <span class=\"arx\">ﷺ<\/span> আল্লাহর রাসূল।<\/p>\n        <p class=\"en\" style=\"margin:0\">There is no god worthy of worship except Allah; Muḥammad <span class=\"arx\">ﷺ<\/span> is the Messenger of Allah.<\/p><div style=\"font-size:7.8pt;color:#9A7B1C;margin-top:1mm\">সূত্র: প্রথম অংশ: সূরা মুহাম্মাদ ৪৭:১৯; দ্বিতীয় অংশ: সূরা আল-ফাতহ ৪৮:২৯<\/div><\/div><div class=\"card\" style=\"margin-bottom:5mm;text-align:center;padding:5mm 4mm\"><h4>কালিমা শাহাদাত<small>Kalimah Shahādah<\/small><\/h4>\n        <div class=\"ar\" style=\"font-size:31pt;color:#123A63;line-height:1.9;margin:3mm 0\">أَشۡهَدُ أَنۡ لَا إِلَٰهَ إِلَّا اللَّهُ وَحۡدَهُ لَا شَرِيكَ لَهُ، وَأَشۡهَدُ أَنَّ مُحَمَّدًا عَبۡدُهُ وَرَسُولُهُ<\/div><p style=\"margin:1mm 0 0;font-size:10pt\">আমি সাক্ষ্য দিচ্ছি যে, আল্লাহ ছাড়া কোনো ইলাহ নেই, তিনি এক, তাঁর কোনো শরীক নেই; এবং আমি সাক্ষ্য দিচ্ছি যে, মুহাম্মাদ <span class=\"arx\">ﷺ<\/span> তাঁর বান্দা ও রাসূল।<\/p>\n        <p class=\"en\" style=\"margin:0\">I bear witness that there is no god but Allah, alone, without partner; and I bear witness that Muḥammad is His servant and Messenger.<\/p><div style=\"font-size:7.8pt;color:#9A7B1C;margin-top:1mm\">সূত্র: সহীহ মুসলিম ২৩৪ (অজুর পরের দোয়া)<\/div><\/div><div class=\"sl\"><b>ইসলামের পাঁচ স্তম্ভ<\/b><i>Five pillars of Islam · Bukhārī 8, Muslim 16<\/i><\/div><div style=\"display:grid;grid-template-columns:repeat(5,1fr);gap:2mm\"><div class=\"card\" style=\"text-align:center;padding:5mm 1mm\"><div style=\"width:9mm;height:9mm;border-radius:50%;background:#7A5A12;color:#fff;margin:0 auto 1mm;display:flex;align-items:center;justify-content:center;font-weight:700\">১<\/div><b style=\"font-size:10pt\">কালিমা (ঈমান)<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#666\">Testimony of faith<\/div><\/div><div class=\"card\" style=\"text-align:center;padding:5mm 1mm\"><div style=\"width:9mm;height:9mm;border-radius:50%;background:#7A5A12;color:#fff;margin:0 auto 1mm;display:flex;align-items:center;justify-content:center;font-weight:700\">২<\/div><b style=\"font-size:10pt\">নামাজ<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#666\">Ṣalāh<\/div><\/div><div class=\"card\" style=\"text-align:center;padding:5mm 1mm\"><div style=\"width:9mm;height:9mm;border-radius:50%;background:#7A5A12;color:#fff;margin:0 auto 1mm;display:flex;align-items:center;justify-content:center;font-weight:700\">৩<\/div><b style=\"font-size:10pt\">যাকাত<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#666\">Zakāh<\/div><\/div><div class=\"card\" style=\"text-align:center;padding:5mm 1mm\"><div style=\"width:9mm;height:9mm;border-radius:50%;background:#7A5A12;color:#fff;margin:0 auto 1mm;display:flex;align-items:center;justify-content:center;font-weight:700\">৪<\/div><b style=\"font-size:10pt\">রোজা<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#666\">Fasting<\/div><\/div><div class=\"card\" style=\"text-align:center;padding:5mm 1mm\"><div style=\"width:9mm;height:9mm;border-radius:50%;background:#7A5A12;color:#fff;margin:0 auto 1mm;display:flex;align-items:center;justify-content:center;font-weight:700\">৫<\/div><b style=\"font-size:10pt\">হজ্জ<\/b><div style=\"font-family:Montserrat;font-size:7pt;color:#666\">Ḥajj<\/div><\/div><\/div><div style=\"flex:1\"><\/div>"}, {"id": "l61", "bn": "নামাজের দোয়া (১)", "en": "Duʿās of Ṣalāh (I)", "no": 58, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫৮<\/b><i>Lesson 58<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">নামাজের দোয়া (১)<\/div><div class=\"e\">Duʿās of Ṣalāh (I)<\/div><\/div><div class=\"badge\"><b>দিন ৫৮<\/b><i>Day 58<\/i><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>ছানা<small>Opening supplication<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">আবু দাউদ ৭৭৫; তিরমিযী ২৪৩<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:19pt;color:#123A63;line-height:1.75;text-align:center\">سُبۡحَانَكَ اللَّهُمَّ وَبِحَمۡدِكَ، وَتَبَارَكَ اسۡمُكَ، وَتَعَالَى جَدُّكَ، وَلَا إِلَٰهَ غَيۡرُكَ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! তুমি পবিত্র, সকল প্রশংসা তোমার; তোমার নাম বরকতময়, তোমার মর্যাদা সুউচ্চ, তুমি ছাড়া কোনো ইলাহ নেই।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Glory be to You, O Allah, and praise; blessed is Your name, exalted is Your majesty, and there is no god but You.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>রুকুর তাসবীহ<small>In rukūʿ<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ মুসলিম ৭৭২<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:21pt;color:#123A63;line-height:1.75;text-align:center\">سُبۡحَانَ رَبِّيَ الۡعَظِيمِ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">আমার মহান প্রতিপালক পবিত্র।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Glory be to my Lord, the Magnificent.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>রুকু থেকে ওঠার সময়<small>Rising from rukūʿ<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ বুখারী ৭৩২<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:20pt;color:#123A63;line-height:1.75;text-align:center\">سَمِعَ اللَّهُ لِمَنۡ حَمِدَهُ ، رَبَّنَا وَلَكَ الۡحَمۡدُ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">যে আল্লাহর প্রশংসা করে, আল্লাহ তা শোনেন। হে আমাদের রব, সকল প্রশংসা তোমারই।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Allah hears the one who praises Him. Our Lord, to You is all praise.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>সিজদার তাসবীহ<small>In sujūd<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ মুসলিম ৭৭২<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:21pt;color:#123A63;line-height:1.75;text-align:center\">سُبۡحَانَ رَبِّيَ الۡأَعۡلَى<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">আমার সর্বোচ্চ প্রতিপালক পবিত্র।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Glory be to my Lord, the Most High.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>তাশাহহুদ (আত্তাহিয়্যাতু)<small>Tashahhud<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">বুখারী ৮৩১; মুসলিম ৪০২<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:17pt;color:#123A63;line-height:1.75;text-align:center\">التَّحِيَّاتُ لِلَّهِ وَالصَّلَوَاتُ وَالطَّيِّبَاتُ، السَّلَامُ عَلَيۡكَ أَيُّهَا النَّبِيُّ وَرَحۡمَةُ اللَّهِ وَبَرَكَاتُهُ، السَّلَامُ عَلَيۡنَا وَعَلَى عِبَادِ اللَّهِ الصَّالِحِينَ، أَشۡهَدُ أَنۡ لَا إِلَٰهَ إِلَّا اللَّهُ، وَأَشۡهَدُ أَنَّ مُحَمَّدًا عَبۡدُهُ وَرَسُولُهُ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">সকল মৌখিক, শারীরিক ও আর্থিক ইবাদত আল্লাহর জন্য। হে নবী! আপনার প্রতি সালাম, আল্লাহর রহমত ও বরকত। আমাদের ও আল্লাহর নেক বান্দাদের প্রতি সালাম। আমি সাক্ষ্য দিচ্ছি, আল্লাহ ছাড়া কোনো ইলাহ নেই এবং মুহাম্মাদ <span class=\"arx\">ﷺ<\/span> তাঁর বান্দা ও রাসূল।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">All greetings, prayers and good things are for Allah. Peace be upon you, O Prophet, and Allah’s mercy and blessings. Peace be upon us and upon Allah’s righteous servants. I bear witness that there is no god but Allah and that Muḥammad is His servant and Messenger.<\/p><\/div><div style=\"flex:1\"><\/div>"}, {"id": "l62", "bn": "নামাজের দোয়া (২)", "en": "Duʿās of Ṣalāh (II)", "no": 59, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৫৯<\/b><i>Lesson 59<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">নামাজের দোয়া (২)<\/div><div class=\"e\">Duʿās of Ṣalāh (II)<\/div><\/div><div class=\"badge\"><b>দিন ৫৯<\/b><i>Day 59<\/i><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>দরূদে ইবরাহীম<small>Ṣalāh upon the Prophet <span class=\"arx\">ﷺ<\/span><\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ বুখারী ৩৩৭০<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:18pt;color:#123A63;line-height:1.75;text-align:center\">اللَّهُمَّ صَلِّ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا صَلَّيۡتَ عَلَى إِبۡرَاهِيمَ وَعَلَى آلِ إِبۡرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ، اللَّهُمَّ بَارِكۡ عَلَى مُحَمَّدٍ وَعَلَى آلِ مُحَمَّدٍ، كَمَا بَارَكۡتَ عَلَى إِبۡرَاهِيمَ وَعَلَى آلِ إِبۡرَاهِيمَ، إِنَّكَ حَمِيدٌ مَجِيدٌ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! মুহাম্মাদ <span class=\"arx\">ﷺ<\/span> ও তাঁর পরিবারের উপর রহমত বর্ষণ করো, যেমন ইবরাহীম (আ.) ও তাঁর পরিবারের উপর করেছ; নিশ্চয় তুমি প্রশংসিত, মহিমান্বিত। হে আল্লাহ! মুহাম্মাদ <span class=\"arx\">ﷺ<\/span> ও তাঁর পরিবারের উপর বরকত দাও, যেমন ইবরাহীম (আ.) ও তাঁর পরিবারের উপর দিয়েছ; নিশ্চয় তুমি প্রশংসিত, মহিমান্বিত।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">O Allah, send blessings upon Muḥammad and his family as You sent blessings upon Ibrāhīm and his family; You are Praiseworthy, Glorious. O Allah, bless Muḥammad and his family as You blessed Ibrāhīm and his family; You are Praiseworthy, Glorious.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>দোয়া মাসূরা<small>Supplication before salām<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">বুখারী ৮৩৪; মুসলিম ২৭০৫<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:18pt;color:#123A63;line-height:1.75;text-align:center\">اللَّهُمَّ إِنِّي ظَلَمۡتُ نَفۡسِي ظُلۡمًا كَثِيرًا، وَلَا يَغۡفِرُ الذُّنُوبَ إِلَّا أَنۡتَ، فَاغۡفِرۡ لِي مَغۡفِرَةً مِنۡ عِنۡدِكَ، وَارۡحَمۡنِي، إِنَّكَ أَنۡتَ الۡغَفُورُ الرَّحِيمُ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! আমি নিজের উপর অনেক জুলুম করেছি, আর তুমি ছাড়া কেউ গুনাহ ক্ষমা করতে পারে না। তাই তোমার পক্ষ থেকে আমাকে ক্ষমা করো এবং আমার প্রতি দয়া করো; নিশ্চয় তুমি ক্ষমাশীল, দয়ালু।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">O Allah, I have wronged myself greatly and none forgives sins but You; so forgive me with forgiveness from You and have mercy on me. You are the Forgiving, the Merciful.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>সালাম ফেরানো<small>Closing salām<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ মুসলিম ৫৮২<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:21pt;color:#123A63;line-height:1.75;text-align:center\">السَّلَامُ عَلَيۡكُمۡ وَرَحۡمَةُ اللَّهِ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">আপনাদের উপর শান্তি ও আল্লাহর রহমত বর্ষিত হোক।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Peace be upon you and the mercy of Allah.<\/p><\/div><div style=\"flex:1\"><\/div>"}, {"id": "l63", "bn": "দৈনন্দিন মাসনূন দোয়া (১)", "en": "Daily Sunnah Duʿās (I)", "no": 60, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৬০<\/b><i>Lesson 60<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">দৈনন্দিন মাসনূন দোয়া (১)<\/div><div class=\"e\">Daily Sunnah Duʿās (I)<\/div><\/div><div class=\"badge\"><b>দিন ৬০<\/b><i>Day 60<\/i><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>খাওয়ার শুরুতে<small>Before eating<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">আবু দাউদ ৩৭৬৭; তিরমিযী ১৮৫৮<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:19pt;color:#123A63;line-height:1.75;text-align:center\">بِسۡمِ اللَّهِ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">আল্লাহর নামে (শুরু করছি)। ভুলে গেলে: <span class=\"arx\">بِسۡمِ اللَّهِ أَوَّلَهُ وَآخِرَهُ<\/span><\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">In the name of Allah. If forgotten: “In the name of Allah, at its beginning and its end.”<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>খাওয়ার পরে<small>After eating<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">আবু দাউদ ৪০২৩; তিরমিযী ৩৪৫৮<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:18pt;color:#123A63;line-height:1.75;text-align:center\">الۡحَمۡدُ لِلَّهِ الَّذِي أَطۡعَمَنِي هَٰذَا وَرَزَقَنِيهِ مِنۡ غَيۡرِ حَوۡلٍ مِنِّي وَلَا قُوَّةٍ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">সকল প্রশংসা আল্লাহর, যিনি আমার কোনো শক্তি-সামর্থ্য ছাড়াই আমাকে এ খাবার খাওয়ালেন ও রিযিক দিলেন।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Praise be to Allah who fed me this and provided it for me without any power or might from me.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>ঘুমানোর আগে<small>Before sleeping<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ বুখারী ৬৩২৪<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:19pt;color:#123A63;line-height:1.75;text-align:center\">بِاسۡمِكَ اللَّهُمَّ أَمُوتُ وَأَحۡيَا<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! তোমার নামেই আমি মরি ও জীবিত হই।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">In Your name, O Allah, I die and I live.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>ঘুম থেকে উঠে<small>On waking<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ বুখারী ৬৩২৪<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:18pt;color:#123A63;line-height:1.75;text-align:center\">الۡحَمۡدُ لِلَّهِ الَّذِي أَحۡيَانَا بَعۡدَ مَا أَمَاتَنَا وَإِلَيۡهِ النُّشُورُ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">সকল প্রশংসা আল্লাহর, যিনি মৃত্যুর (ঘুমের) পর আমাদের জীবিত করেছেন এবং তাঁরই কাছে ফিরে যেতে হবে।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Praise be to Allah who gave us life after causing us to die, and to Him is the return.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>মসজিদে প্রবেশের সময়<small>Entering the masjid<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ মুসলিম ৭১৩<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:19pt;color:#123A63;line-height:1.75;text-align:center\">اللَّهُمَّ افۡتَحۡ لِي أَبۡوَابَ رَحۡمَتِكَ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! আমার জন্য তোমার রহমতের দরজাগুলো খুলে দাও।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">O Allah, open for me the doors of Your mercy.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>মসজিদ থেকে বের হওয়ার সময়<small>Leaving the masjid<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সহীহ মুসলিম ৭১৩<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:19pt;color:#123A63;line-height:1.75;text-align:center\">اللَّهُمَّ إِنِّي أَسۡأَلُكَ مِنۡ فَضۡلِكَ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! আমি তোমার অনুগ্রহ প্রার্থনা করি।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">O Allah, I ask You of Your bounty.<\/p><\/div><div style=\"flex:1\"><\/div>"}, {"id": "l64", "bn": "দৈনন্দিন মাসনূন দোয়া (২)", "en": "Daily Duʿās (II)", "no": 61, "part": "ষষ্ঠ অংশ: সূরা, কালিমা ও দোয়া · Part 6: Sūrahs, Kalimah & Duʿās", "c": "#7A5A12", "tint": "#FBF6E8", "html": "<div class=\"lh\"><div class=\"badge\"><b>পাঠ ৬১<\/b><i>Lesson 61<\/i><\/div><div class=\"cart\"><svg viewBox=\"0 0 400 70\" preserveAspectRatio=\"none\" xmlns=\"http://www.w3.org/2000/svg\">\n  <path d=\"M30 4 H370 L382 14 L396 35 L382 56 L370 66 H30 L18 56 L4 35 L18 14 Z\" fill=\"#0B4A3E\"/>\n  <path d=\"M33 8 H367 L377 17 L389 35 L377 53 L367 62 H33 L23 53 L11 35 L23 17 Z\" fill=\"#EEF6F1\" stroke=\"#C9A227\" stroke-width=\"1.4\"/>\n  <path d=\"M38 12 H362 M38 58 H362\" stroke=\"#C9A227\" stroke-width=\".6\" stroke-dasharray=\"2 3\"/>\n<\/svg><div class=\"t\">দৈনন্দিন মাসনূন দোয়া (২)<\/div><div class=\"e\">Daily Duʿās (II)<\/div><\/div><div class=\"badge\"><b>দিন ৬১<\/b><i>Day 61<\/i><\/div><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>পড়া শুরুর আগে<small>Before studying<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সূরা ত্বা-হা ২০:১১৪<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:22pt;color:#123A63;line-height:1.75;text-align:center\">رَّبِّ زِدۡنِي عِلۡمࣰا<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আমার প্রতিপালক! আমার জ্ঞান বৃদ্ধি করে দাও।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">My Lord, increase me in knowledge.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>পিতা-মাতার জন্য<small>For parents<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সূরা বনী ইসরাঈল ১৭:২৪<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:20pt;color:#123A63;line-height:1.75;text-align:center\">رَّبِّ ٱرۡحَمۡهُمَا كَمَا رَبَّيَانِي صَغِيرࣰا<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আমার প্রতিপালক! তাদের প্রতি দয়া করো, যেমন তারা শৈশবে আমাকে লালন-পালন করেছেন।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">My Lord, have mercy upon them as they brought me up when I was small.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>দুনিয়া ও আখিরাতের কল্যাণ<small>Good in both worlds<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">সূরা আল-বাকারা ২:২০১<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:20pt;color:#123A63;line-height:1.75;text-align:center\">رَبَّنَآ ءَاتِنَا فِي ٱلدُّنۡيَا حَسَنَةࣰ وَفِي ٱلۡأٓخِرَةِ حَسَنَةࣰ وَقِنَا عَذَابَ ٱلنَّارِ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আমাদের প্রতিপালক! আমাদের দুনিয়াতে কল্যাণ দাও, আখিরাতেও কল্যাণ দাও এবং জাহান্নামের আযাব থেকে রক্ষা করো।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">Our Lord, give us good in this world and good in the Hereafter, and protect us from the punishment of the Fire.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>টয়লেটে প্রবেশের আগে<small>Entering the toilet<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">বুখারী ১৪২; মুসলিম ৩৭৫<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:19pt;color:#123A63;line-height:1.75;text-align:center\">اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الۡخُبُثِ وَالۡخَبَائِثِ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! আমি তোমার কাছে পুরুষ ও নারী শয়তান থেকে আশ্রয় চাই।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">O Allah, I seek refuge in You from the male and female devils.<\/p><\/div><div class=\"card\" style=\"margin-bottom:2mm\"><div style=\"display:flex;justify-content:space-between;align-items:baseline\"><h4>টয়লেট থেকে বের হয়ে<small>Leaving the toilet<\/small><\/h4><span style=\"font-size:7.4pt;color:#9A7B1C;font-weight:600\">আবু দাউদ ৩০; তিরমিযী ৭<\/span><\/div>\n        <div class=\"ar\" style=\"font-size:21pt;color:#123A63;line-height:1.75;text-align:center\">غُفۡرَانَكَ<\/div><p style=\"margin:.4mm 0 0;font-size:9.2pt;line-height:1.4\">হে আল্লাহ! তোমার ক্ষমা চাই।<\/p>\n        <p class=\"en\" style=\"margin:0;font-size:7.6pt\">I seek Your forgiveness.<\/p><\/div><div style=\"flex:1\"><\/div>"}];
const S = (()=>{try{return JSON.parse(localStorage.getItem('tqii-qaida')||'{}')}catch(e){return {}}})();
const save=()=>{try{localStorage.setItem('tqii-qaida',JSON.stringify(S))}catch(e){}};
S.lang=S.lang||'bn'; S.rate=S.rate||0.9; S.done=S.done||{};
const $=s=>document.querySelector(s), app=$('#app');
const ICON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
const AR=/[\u0600-\u06FF\u0750-\u077F\u08A0-\u08FF\uFB50-\uFDF9\uFDFB-\uFDFF\uFE70-\uFEFF\u200d]+/g;

/* ---------- speech ---------- */
const synth = window.speechSynthesis; let voices=[]; let cur=null; let VO=null;
function loadVoices(){
  if(!synth) return; voices = synth.getVoices();
  fill('#vbn', v=>/^bn/i.test(v.lang), 'bn'); fill('#ven', v=>/^en/i.test(v.lang), 'en');
  const hasBn = voices.some(v=>/^bn/i.test(v.lang));
  $('#vhint').textContent = hasBn ? '' : 'এই ডিভাইসে বাংলা কণ্ঠ পাওয়া যায়নি। Android: Settings → Text-to-speech → Google Speech Services → বাংলা ভয়েস ডাউনলোড করুন। কম্পিউটারে Chrome বা Edge ব্রাউজার ব্যবহার করুন; Windows Settings → Time & Language → Speech থেকে বাংলা কণ্ঠ যোগ করা যায়।';
  const n=document.getElementById('vnote'); if(n) n.classList.toggle('on', !VO && voices.length>0 && !hasBn); if(VO) $('#vhint').textContent='';
}
function fill(sel, test, k){
  const el=$(sel), list=voices.filter(test);
  el.innerHTML = list.length ? list.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} (${esc(v.lang)})</option>`).join('') : '<option value="">— পাওয়া যায়নি / not available —</option>';
  const pref = S['v'+k] && list.find(v=>v.name===S['v'+k]) ? S['v'+k] : (list.find(v=>/google|natural|online/i.test(v.name))||list[0]||{}).name;
  if(pref) el.value=pref;
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}
if(synth){ loadVoices(); synth.onvoiceschanged = loadVoices; }
function clean(t, lang){
  t = t.replace(/\uFDFA/g, lang==='bn' ? ' সাল্লাল্লাহু আলাইহি ওয়াসাল্লাম ' : ' peace be upon him ');
  t = t.replace(AR, ' , ').replace(/[﴿﴾]/g,' ');
  if(lang==='en') t = t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[ʿʾ`´]/g,'');
  return t.replace(/\s*([,;:·•—–])\s*(?=[,;:·•—–])/g,'').replace(/[·•]/g,', ').replace(/\s+/g,' ').trim();
}
function chunks(t){ return t.split(/(?<=[।.?!])\s+/).reduce((a,s)=>{ if(a.length && (a[a.length-1]+s).length<180) a[a.length-1]+=' '+s; else a.push(s); return a; },[]).filter(s=>s.replace(/[\s,.;:]/g,'').length); }
/* embedded AI voice (pre-recorded clips) with device-voice fallback */
if(window.fetch) fetch('audio/manifest.json').then(r=>r.ok?r.json():null).then(j=>{ VO=j; if(j) loadVoices(); }).catch(()=>{});
const vkey=s=>s.replace(/^[\s,.;:।?!—–-]+|[\s,.;:।?!—–-]+$/g,'').replace(/\s+/g,' ');
const player=new Audio(); player.preload='auto'; let qid=0;
function speak(text, lang, el){
  stop(); const parts = clean(text, lang).split(/(?<=[।.?!])\s+/).filter(s=>vkey(s).replace(/[\s,.;:]/g,'').length);
  if(!parts.length){ toast(lang==='en'?'No English text here — try বাংলা.':'এখানে বাংলা লেখা নেই — English চাপুন।'); return; }
  const map=(VO&&VO[lang])||{}, vn=synth&&$(lang==='bn'?'#vbn':'#ven').value, voice=voices.find(v=>v.name===vn);
  const q=parts.map(p=>({f:map[vkey(p)],t:p})).filter(x=>x.f||synth);
  if(!q.length){ toast('এই ডিভাইসে কণ্ঠ সুবিধা নেই।'); return; }
  const id=++qid; cur=el||null; if(cur) cur.classList.add('speaking');
  const done=()=>{ if(id!==qid) return; if(cur) cur.classList.remove('speaking'); cur=null; };
  const tts=t=>{ const u=new SpeechSynthesisUtterance(t); u.lang = voice?voice.lang:(lang==='bn'?'bn-BD':'en-US'); if(voice) u.voice=voice; u.rate=S.rate; u.onend=u.onerror=next; synth.speak(u); };
  const fail=it=>{ if(id!==qid||it.x) return; it.x=1; if(synth) tts(it.t); else next(); };
  let i=0; const next=()=>{ if(id!==qid) return; if(i>=q.length) return done(); const it=q[i++];
    if(it.f){ player.src='audio/'+it.f; player.playbackRate=Math.max(.5,Math.min(2,S.rate/0.9)); player.onended=next; player.onerror=()=>fail(it);
      const pr=player.play(); if(pr&&pr.catch) pr.catch(()=>fail(it)); }
    else tts(it.t); };
  next();
}
function stop(){ qid++; try{ player.pause(); player.onended=player.onerror=null; }catch(e){} if(synth) synth.cancel(); if(cur) cur.classList.remove('speaking'); cur=null; }
let tt; function toast(m){ let n=$('#toast'); if(!n){ n=document.createElement('div'); n.id='toast'; n.style.cssText='position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#001E19;color:#fff;border:1px solid #D4AF37;border-radius:12px;padding:10px 16px;z-index:50;max-width:90vw;font-size:14px'; document.body.appendChild(n);} n.textContent=m; n.style.display='block'; clearTimeout(tt); tt=setTimeout(()=>n.style.display='none',2600); }

/* text of an element in one language */
function textOf(el, lang){
  const c = el.cloneNode(true); c.querySelectorAll('svg,.sayrow,.num').forEach(x=>x.remove());
  const isEn = x => x.matches('.en,.enq,.s2,.e,i,small,.r') ;
  if(lang==='en'){
    if(isEn(el) || el.closest('.enq')) return c.textContent;
    return [...c.querySelectorAll('.en,.enq,.s2,.cart .e,.badge i,small,.sl i')].map(x=>x.textContent).join('. ');
  }
  if(el.closest('.enq')) return '';
  c.querySelectorAll('.en,.enq,.s2,.e,.badge i,small,.sl i,.r').forEach(x=>x.remove());
  return c.textContent;
}
function sayEl(el, lang){ speak(textOf(el, lang||S.lang), lang||S.lang, el); }

/* make lesson content speakable */
function wire(root){
  root.querySelectorAll('.qa').forEach(q=>{
    const b=q.querySelector('.bnq'), e=q.querySelector('.enq');
    if(b) b.insertAdjacentHTML('beforeend', `<div class="sayrow"><button class="say" data-l="bn">${ICON} বাংলায় শুনুন</button></div>`);
    if(e) e.insertAdjacentHTML('beforeend', `<div class="sayrow"><button class="say en" data-l="en">${ICON} Listen in English</button></div>`);
  });
  root.querySelectorAll('.tip').forEach(t=>t.lastElementChild.insertAdjacentHTML('beforeend', `<div class="sayrow"><button class="say" data-l="bn">${ICON} বাংলা</button><button class="say en" data-l="en">${ICON} English</button></div>`));
  const sel = '.cart, .card, li, table.t tr:not(:first-child), .grid .cell, .exm .e, .body p, .sl, .sbox .sh';
  root.querySelectorAll(sel).forEach(el=>{ if(el.closest('.qa,.tip')) return; if(!el.textContent.replace(AR,'').trim()) return; el.setAttribute('data-say',''); el.tabIndex=0; });
}
app.addEventListener('click', e=>{
  const b = e.target.closest('.say');
  if(b){ e.stopPropagation(); const box = b.closest('.bnq,.enq,.tip'); sayEl(box, b.dataset.l); return; }
  const s = e.target.closest('[data-say]'); if(s){ sayEl(s); }
  const c = e.target.closest('[data-open]'); if(c){ location.hash = c.dataset.open; }
});
app.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-say]')){ e.preventDefault(); sayEl(e.target); } });

xvAMz/A8JrfDw1dheIZneIZneIZneIZneIZneIZneIZneIZneIZneIZneDbV+f8IZlYn18oBIgAAAABJRU5ErkJggg==" alt="TQII লোগো">
    <div><h1>তালিমুল কোরআন কায়দা</h1><div class="en">TQII QAIDA</div>
    <p>বই যেমন, অ্যাপও তেমন — প্রতিটি পাঠের ব্যাখ্যা বাংলা ও ইংরেজি কণ্ঠে শোনা যায়। আরবি উচ্চারণ ও মাশক করাবেন উস্তাদ; অ্যাপ শুধু বুঝিয়ে দেবে।</p>
    <div class="cta"><button class="btn" data-open="${next.id}">${doneN? 'চালিয়ে যান: ' : 'শুরু করুন: '}${esc(next.bn)}</button><button class="btn ghost" data-open="${L[0].id}">ভূমিকা</button></div>
    <p style="margin:12px 0 0;font-size:13.5px;color:#b9d3ca">শেখা হয়েছে: ${doneN} / ${L.length} পাঠ</p></div>
  </section>
  <div class="how">
    <div><b>১. ভাষা বেছে নিন</b>উপরের “বাংলা / English” বোতাম থেকে<span>Pick the listening language at the top</span></div>
    <div><b>২. যেকোনো লাইনে চাপুন</b>প্রশ্নোত্তর, ঘর, তালিকা — চাপলেই পড়ে শোনাবে<span>Tap any line, box or cell to hear it</span></div>
    <div><b>৩. আরবি উস্তাদের কাছে</b>আরবি অংশ অ্যাপ পড়ে না; শিক্ষক মাশক করাবেন<span>Arabic is taught by the teacher, not the app</span></div>
  </div>
  ${parts.map(p=>{ const [b,en]=p.n.split(' · '); return `<section class="part"><h2>${esc(b)}<small>${esc(en||'')}</small></h2><div class="cards">${p.ls.map(l=>`<button class="lc ${S.done[l.id]?'done':''}" style="--c:${l.c}" data-open="${l.id}"><span class="n">${l.no?toBn(l.no):'•'}</span><span><b>${esc(l.bn)}</b><small>${esc(l.en)}</small></span></button>`).join('')}</div></section>`; }).join('')}`;
  loadVoices();
}
const toBn = n => String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
function lesson(id){
  const i = L.findIndex(l=>l.id===id); if(i<0) return home(); const l=L[i];
  app.innerHTML = `<div class="notice" id="vnote">এই ডিভাইসে বাংলা কণ্ঠ পাওয়া যায়নি — সেটিংস (⚙) খুলে নির্দেশনা দেখুন।</div>
   <div class="lessonbar"><button class="pill" data-open="home">‹ সব পাঠ</button><div class="t"><small>${esc(l.part)}</small></div>
   <button class="pill gold" id="all">${ICON} পুরো পাঠ বুঝিয়ে দিন</button></div>
   <article class="paper" style="--c:${l.c};--tint:${l.tint}"><div class="content">${l.html}</div></article>`;
  wire(app); loadVoices();
  $('#all').onclick = ()=>{ const root=app.querySelector('.paper'); const bits=[root.querySelector('.cart'), ...root.querySelectorAll(S.lang==='en'?'.qa .enq':'.qa .bnq'), ...root.querySelectorAll('.tip')].filter(Boolean);
    speak(bits.map(b=>textOf(b,S.lang)).join('. '), S.lang, root.querySelector('.qa')||root.querySelector('.cart')); };
  $('#nav').hidden=false; $('#mid').innerHTML = `<b>${l.no? 'পাঠ '+toBn(l.no) : esc(l.bn)}</b> · ${toBn(i+1)}/${toBn(L.length)}`;
  $('#prev').disabled = i===0; $('#next').disabled = i===L.length-1;
  $('#prev').onclick=()=>location.hash=L[i-1].id; $('#next').onclick=()=>location.hash=L[i+1].id;
  const m=$('#mark'); const upd=()=>{ m.classList.toggle('done',!!S.done[l.id]); m.textContent = S.done[l.id]?'শেখা হয়েছে ✓':'শেখা হয়েছে?'; }; upd();
  m.onclick=()=>{ S.done[l.id]=!S.done[l.id]; save(); upd(); };
  window.scrollTo(0,0);
}
function route(){ stop(); const h=location.hash.slice(1); if(!h||h==='home') home(); else lesson(h); }
window.addEventListener('hashchange', route);
$('#home').onclick=()=>location.hash='home';
function setLang(k){ S.lang=k; save(); $('#lbn').setAttribute('aria-pressed',k==='bn'); $('#len').setAttribute('aria-pressed',k==='en'); }
$('#lbn').onclick=()=>setLang('bn'); $('#len').onclick=()=>setLang('en'); setLang(S.lang);
$('#stop').onclick=stop;
$('#set').onclick=()=>{ loadVoices(); $('#sheet').classList.add('on'); };
$('#close').onclick=()=>$('#sheet').classList.remove('on');
$('#sheet').onclick=e=>{ if(e.target.id==='sheet') $('#sheet').classList.remove('on'); };
$('#vbn').onchange=e=>{S.vbn=e.target.value;save();}; $('#ven').onchange=e=>{S.ven=e.target.value;save();};
const r=$('#rate'); r.value=S.rate; $('#rv').textContent='×'+S.rate; r.oninput=()=>{S.rate=+r.value; $('#rv').textContent='×'+S.rate; save();};
const cm=$('#cm'); cm.checked=!!S.cm; document.body.classList.toggle('classmode',!!S.cm); cm.onchange=()=>{S.cm=cm.checked; save(); document.body.classList.toggle('classmode',S.cm);};
$('#tbn').onclick=()=>speak('আসসালামু আলাইকুম। এটি তালিমুল কোরআন কায়দা।','bn');
$('#ten').onclick=()=>speak('Assalamu alaikum. This is the TQII Qaida.','en');
document.addEventListener('keydown',e=>{ if(e.target.closest('input,select')) return; if($('#nav').hidden) return; if(e.key==='ArrowRight'&&!$('#next').disabled) $('#next').click(); if(e.key==='ArrowLeft'&&!$('#prev').disabled) $('#prev').click(); if(e.key==='Escape') stop(); });
route();
let dp=null; window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); dp=e; $('#inst').hidden=false; });
$('#inst').onclick=async()=>{ if(!dp) return; dp.prompt(); await dp.userChoice; dp=null; $('#inst').hidden=true; };
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script></body></html>
