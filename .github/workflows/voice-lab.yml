name: voice lab
on:
  push:
    branches: [voice-lab]
    paths: ["voicelab/asr.py", "voicelab/samples.json", ".github/workflows/voice-lab.yml"]
permissions: { contents: write }
jobs:
  asr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q faster-whisper && python voicelab/asr.py
