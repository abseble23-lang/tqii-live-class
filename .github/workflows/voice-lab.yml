name: voice lab
on:
  push:
    branches: [voice-lab]
    paths: ["voicelab/**", ".github/workflows/voice-lab.yml"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          M=Banglabox/chatterbox-bangla-tts
          curl -s "https://huggingface.co/api/models/$M" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(s['rfilename']) for s in d['siblings'] if not s['rfilename'].startswith('inference/src') and not s['rfilename'].startswith('training/')]"
          echo ===README; curl -sL https://huggingface.co/$M/raw/main/README.md | tail -c +2500 | head -c 5000
          echo ===REQ; curl -sL https://huggingface.co/$M/raw/main/inference/requirements.txt
          echo ===INFER; curl -sL https://huggingface.co/$M/raw/main/inference/infer.py | head -c 9000
          echo ===NORM; curl -sL https://huggingface.co/$M/raw/main/inference/bn_norm.py | head -c 2500
          nproc; free -g | head -2
