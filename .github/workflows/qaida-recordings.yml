name: Qaida teacher recordings
on:
  schedule: [{ cron: "17 20 * * *" }]   # every night 02:17 Bangladesh time
  workflow_dispatch:
permissions:
  contents: write
  actions: write
  id-token: write
concurrency: { group: qaida-recordings }
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q numpy
      - id: rec
        run: python3 tools/qaida-voice/apply_recordings.py
      - if: steps.rec.outputs.changed != '0'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          git config user.name "tqii-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A web-qaida/audio
          git commit -m "Qaida: teacher recordings (${{ steps.rec.outputs.changed }} changed)"
          git push
          gh workflow run qaida.yml --ref main
          gh workflow run admin-pages.yml --ref main
